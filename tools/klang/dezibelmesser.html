<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dezibelmesser</title>
<script src="/common.js"></script>
<style>
/* Nur seitenspezifisches CSS – alles andere kommt aus common.js */
.tc{text-align:center}

/* große Zahl */
.dbnum{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{color:var(--muted);font-size:var(--fs-text);font-weight:600;margin-top:2px}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}

/* Pegelanzeige */
.meter{height:14px;border-radius:var(--r-pill);background:linear-gradient(90deg,var(--ok),var(--warn) 60%,var(--a1));
  position:relative;overflow:hidden;margin:var(--sp-14) 0 var(--sp-4)}
.meter i{position:absolute;right:0;top:0;bottom:0;width:100%;background:var(--card2);transition:width .1s}
.cat{font-weight:700;font-size:var(--fs-base);margin-top:var(--sp-10);min-height:1.4em}

/* Messwerte */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-8);text-align:center}
.stats .v{font-size:var(--fs-logo-md);font-weight:900;font-variant-numeric:tabular-nums}
.stats .l{color:var(--muted);font-size:var(--fs-hint);font-weight:600}
canvas.hist{width:100%;height:130px;display:block;border-radius:var(--r-small);background:var(--card2);border:1px solid var(--line)}

/* Schieberegler */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:var(--r-pill);
  background:var(--card2);border:1px solid var(--line);outline:none;margin:var(--sp-4) 0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--grad);border:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--a1);border:0}

@media (max-width:360px){.dbnum{font-size:64px}}
@media (prefers-reduced-motion:reduce){.meter i{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const $ = id => document.getElementById(id);
const HMAX = 120;                       /* 120 Punkte × 0,5 s = 60 s */
const DEF_OFFSET = 95;

/* ---------- Speicher: nur die Kalibrierung ---------- */
const st = App.store.create("klang_dezibelmesser", {
  defaults: { offset: DEF_OFFSET },
  validate: d => d && typeof d === "object" && Number(d.offset) > 0
});
App.store.check();

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
let offset = clamp(Number(st.load().offset) || DEF_OFFSET, 70, 120);

/* ---------- Zustand ---------- */
let ctx = null, analyser = null, src = null, stream = null, buf = null;
let listening = false, raf = null;
let ps = 1e-9, lastTs = 0, lastShow = 0, lastHist = 0, lastWarn = -1e9, startTs = 0;
let dbNow = 0, hasValue = false, mn = null, mx = null, sumE = 0, cnt = 0;
const hist = [];

function category(d){
  if(d < 30) return "🤫 Sehr leise";
  if(d < 45) return "🌿 Leise (Flüstern, ruhiges Zimmer)";
  if(d < 60) return "💬 Normal (leises Gespräch)";
  if(d < 75) return "🚗 Laut (Gespräch, Straßenverkehr)";
  if(d < 85) return "📢 Sehr laut (Staubsauger, Pausenhof)";
  return "⚠️ Sehr laut – Gehör kann bei Dauer Schaden nehmen";
}
const show = v => v == null ? "–" : String(Math.round(v));

/* ---------- Screen ---------- */
function renderHome(){
  const ui = App.ui;
  App.render(
    ui.topbar([{ label: "🎵 Klang-Tools", href: "../klang.html" }]) +
    ui.header("DEZIBELMESSER", "Wie laut ist es gerade?", "md") +

    ui.card("",
      `<div class="dbnum" id="db">–</div>
       <div class="unit">dB (Richtwert)</div>
       <div class="meter"><i id="fill"></i></div>
       <div class="scale"><span>20</span><span>50</span><span>80</span><span>120 dB</span></div>
       <div class="cat" id="cat">Mikrofon starten, um zu messen</div>`, "tc") +

    ui.card("Messwerte",
      `<div class="stats">
         <div><div class="v" id="vmin">–</div><div class="l">Minimum</div></div>
         <div><div class="v" id="vavg">–</div><div class="l">Durchschnitt</div></div>
         <div><div class="v" id="vmax">–</div><div class="l">Maximum</div></div>
       </div>
       <div style="margin-top:var(--sp-14)">${ui.btn("↻ Messwerte zurücksetzen", { kind: "ghost", block: true, action: "reset" })}</div>`) +

    ui.card("Verlauf · letzte 60 Sekunden", `<canvas class="hist" id="hist"></canvas>`) +

    ui.card("Kalibrierung · +" + offset + " dB",
      `<input type="range" id="offset" min="70" max="120" value="${offset}" aria-label="Kalibrierung">` +
      ui.hint("Handy- und Computermikrofone sind nicht geeicht. Der Wert ist nur ein Richtwert. Mit einem Referenzgerät kannst du den Wert hier angleichen."),
      "calib") +

    ui.storageCard([{
      kind: "clearAll",
      run: () => { offset = DEF_OFFSET; st.remove(); }
    }]) +

    ui.bottom(ui.btn(listening ? "■ Messung stoppen" : "🎤 Messung starten",
      { block: true, kind: listening ? "bad" : "", action: "toggle" }))
  );
  renderMain(); renderStats(); drawHist();
}

function renderStats(){
  if(!$("vmin")) return;
  $("vmin").textContent = show(mn);
  $("vmax").textContent = show(mx);
  $("vavg").textContent = cnt ? show(10 * Math.log10(sumE / cnt)) : "–";
}
function renderMain(){
  if(!$("db")) return;
  if(!hasValue){
    $("db").textContent = "–";
    $("fill").style.width = "100%";
    $("cat").textContent = "Mikrofon starten, um zu messen";
    return;
  }
  const d = Math.max(0, dbNow);
  $("db").textContent = Math.round(d);
  $("fill").style.width = (100 - clamp((d - 20) / 100 * 100, 0, 100)) + "%";
  $("cat").textContent = category(d);
}

function resetStats(){
  mn = mx = null; sumE = 0; cnt = 0; hist.length = 0; startTs = performance.now();
  renderStats(); drawHist();
}

function drawHist(){
  const cv = $("hist");
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  if(!w || !h) return;
  if(cv.width !== Math.round(w * dpr)){ cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  const y = d => h - 6 - (clamp(d, 20, 120) - 20) / 100 * (h - 12);
  g.font = "10px system-ui,sans-serif"; g.fillStyle = "#8c95a8"; g.strokeStyle = "#262d3d"; g.lineWidth = 1;
  [40, 60, 80, 100].forEach(v => {
    g.beginPath(); g.moveTo(0, y(v)); g.lineTo(w, y(v)); g.stroke();
    g.fillText(v, 4, y(v) - 3);
  });
  if(hist.length < 2) return;
  const step = w / (HMAX - 1);
  const x0 = w - (hist.length - 1) * step;
  const grad = g.createLinearGradient(0, h, 0, 0);
  grad.addColorStop(0, "#2ee59d"); grad.addColorStop(0.6, "#ffb020"); grad.addColorStop(1, "#ff3b6b");
  g.strokeStyle = grad; g.lineWidth = 3; g.lineJoin = "round"; g.lineCap = "round";
  g.beginPath();
  hist.forEach((v, i) => { const x = x0 + i * step; i ? g.lineTo(x, y(v)) : g.moveTo(x, y(v)); });
  g.stroke();
}

/* ---------- Messschleife ---------- */
function loop(ts){
  if(!listening) return;
  raf = requestAnimationFrame(loop);
  analyser.getFloatTimeDomainData(buf);
  let p = 0;
  for(let i = 0; i < buf.length; i++) p += buf[i] * buf[i];
  p = Math.max(p / buf.length, 1e-12);
  const dt = lastTs ? (ts - lastTs) / 1000 : 0.016;
  lastTs = ts;
  ps += (p - ps) * (1 - Math.exp(-dt / 0.125));      /* Zeitbewertung „Fast“ (125 ms) */
  dbNow = 10 * Math.log10(ps) + offset;

  if(ts - lastShow > 100){
    lastShow = ts;
    hasValue = true;
    renderMain();
    if(performance.now() - startTs > 600){            /* Einschwingphase überspringen */
      const d = Math.max(0, dbNow);
      mn = mn == null ? d : Math.min(mn, d);
      mx = mx == null ? d : Math.max(mx, d);
      sumE += Math.pow(10, d / 10); cnt++;
      renderStats();
      if(d >= 85 && ts - lastWarn > 10000){
        lastWarn = ts;
        App.toast("⚠️ Über 85 dB – auf Dauer schädlich für das Gehör", "warn", 3500);
      }
    }
  }
  if(ts - lastHist > 500){
    lastHist = ts;
    hist.push(Math.max(0, dbNow));
    if(hist.length > HMAX) hist.shift();
    drawHist();
  }
}

/* ---------- Start / Stopp ---------- */
async function start(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    App.toast("Mikrofon wird nicht unterstützt (HTTPS und aktueller Browser nötig)", "warn", 5000);
    return;
  }
  try{
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    src = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = 2048;
    buf = new Float32Array(analyser.fftSize);
    src.connect(analyser);
    listening = true; hasValue = false; lastTs = 0; ps = 1e-9; lastWarn = -1e9;
    resetStats();
    raf = requestAnimationFrame(loop);
    App.wake.on();
    App.refresh();
    App.toast("Messung gestartet", "success", 1800);
  }catch(e){
    App.toast("Kein Zugriff auf das Mikrofon. Bitte im Browser erlauben und Seite neu laden.", "warn", 5000);
  }
}
function stop(){
  listening = false;
  if(raf){ cancelAnimationFrame(raf); raf = null; }
  try{ if(src) src.disconnect(); }catch(e){}
  try{ if(stream) stream.getTracks().forEach(t => t.stop()); }catch(e){}
  src = null; stream = null; analyser = null;
  App.wake.off();
  App.refresh();
  App.toast("Messung gestoppt", "info", 1500);
}

/* ---------- Events ---------- */
App.on(a => {
  if(a === "toggle"){ listening ? stop() : start(); return true; }
  if(a === "reset"){ resetStats(); App.toast("Messwerte zurückgesetzt", "info", 1500); return true; }
});

document.addEventListener("input", e => {
  if(e.target.id !== "offset") return;
  offset = Number(e.target.value);
  const h = document.querySelector(".calib h2");
  if(h) h.textContent = "Kalibrierung · +" + offset + " dB";
  st.save({ offset });
});

window.addEventListener("resize", drawHist);

/* ---------- Start ---------- */
App.screens({ home: renderHome });
App.go("home");
</script>
</body>
</html>
