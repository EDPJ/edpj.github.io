<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dehnen</title>
<!-- Gemeinsame Bausteine (muss das ERSTE Skript sein) -->
<script src="/common.js"></script>
<style>
  /* Nur seiteneigenes CSS – alles andere kommt aus common.js */
  .head{text-align:center;margin-bottom:var(--sp-14)}
  .bar{height:8px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
  .bar>div{height:100%;width:100%;background:var(--ok);transform-origin:left center;transform:scaleX(0);will-change:transform;transition:transform .5s ease}
  .figure{padding:var(--sp-10) var(--sp-10) 0;text-align:center}
  .figure svg{width:100%;height:auto;max-height:32vh;display:block}
  .timer{text-align:center}
  .phase{font-size:var(--fs-text);color:var(--muted);font-weight:600;min-height:1.3em}
  .time{font-size:68px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 var(--sp-10)}
  .time.prep{color:var(--warn)}
  .time.switch{color:var(--a1)}
  .tbar{height:10px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-pill);overflow:hidden}
  .tbar>div{height:100%;width:100%;background:var(--grad);transform-origin:left center;transform:scaleX(0);will-change:transform}
  .tbar.prep>div{background:var(--warn)}
  .timer .btn{margin-top:var(--sp-14)}
  svg .limb{fill:none;stroke:var(--text);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  svg .backl{fill:none;stroke:#6b7490;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  svg .headc{fill:var(--text)}
  svg .hl{fill:rgba(var(--a1-rgb),.45)}
  svg .floor{stroke:#3a4256;stroke-width:4;stroke-linecap:round}
  svg .wall{stroke:#3a4256;stroke-width:10;stroke-linecap:round}
  svg text{font-size:var(--fs-hint);fill:var(--muted);font-family:system-ui,sans-serif}
  @media (max-width:360px){.time{font-size:54px}.big{font-size:var(--fs-stat)}}
  @media (orientation:landscape) and (max-height:500px){.figure svg{max-height:50vh}}
  @media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>
<!-- Übungen aus extra Datei (muss im selben Ordner liegen) -->
<script src="dehnen-uebungen.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Übungen laden (aus dehnen-uebungen.js) ---------- */
const EX_OK = (typeof EX !== "undefined") && App.isFilled(EX);
const LIST = EX_OK ? EX : [];
const CFG = (typeof EINSTELLUNGEN !== "undefined" && EINSTELLUNGEN) ? EINSTELLUNGEN : {};
const PREP_SEC = Number(CFG.prepSec) || 5;
const SWITCH_SEC = Number(CFG.switchSec) || 5;
const N = LIST.length;

/* ---------- Figur als SVG ---------- */
function figureSVG(p){
  let s = '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img">';
  if(p.wall) s += '<line class="wall" x1="274" y1="15" x2="274" y2="180"/>';
  if(!p.nofloor) s += '<line class="floor" x1="12" y1="184" x2="308" y2="184"/>';
  (p.hl||[]).forEach(h => s += `<circle class="hl" cx="${h[0]}" cy="${h[1]}" r="18"/>`);
  (p.back||[]).forEach(d => s += `<path class="backl" d="${d}"/>`);
  p.paths.forEach(d => s += `<path class="limb" d="${d}"/>`);
  s += `<circle class="headc" cx="${p.head[0]}" cy="${p.head[1]}" r="13"/>`;
  if(p.note) s += `<text x="10" y="18">${App.esc(p.note)}</text>`;
  return s + '</svg>';
}

/* ---------- Speicher: lokal, Tag wechselt um 3:00 Uhr (daily) ---------- */
const st = App.store.create("dehnen_v2", {
  version: 1,
  daily: true,
  defaults: { done: [], c: 0 },
  validate: d => d && Array.isArray(d.done) && typeof d.c === "number"
});
const S = { done: [], current: 0 };
function save(){ st.save({ done: S.done, c: S.current }); }
function load(){
  const d = st.load();
  S.done = d.done.map(Number).filter(i => i >= 0 && i < N);
  S.current = (d.c >= 0 && d.c < N) ? d.c : 0;
}
App.store.check();
load();

App.onNewDay(() => {
  S.done = []; S.current = 0;
  setupTimer(false); save(); App.go("home");
});

/* ---------- Timer (performance.now + requestAnimationFrame = flüssiger Balken) ---------- */
const T = { phases:[], total:0, i:0, phaseRem:0, running:false, started:false, finished:false,
            startTs:0, lastSec:null, raf:null, iv:null };
let barEl = null, timeEl = null, phaseEl = null, lastTimeTxt = "", lastPhaseTxt = "";

function stopLoops(){
  clearInterval(T.iv); T.iv = null;
  if(T.raf){ cancelAnimationFrame(T.raf); T.raf = null; }
}
function setupTimer(autostart){
  stopLoops();
  T.running = false; T.started = false; T.finished = false; T.lastSec = null;
  const ex = LIST[S.current];
  if(!ex){ T.phases = []; T.i = 0; T.phaseRem = 0; return; }
  T.phases = [{l:"Gleich geht’s los – Position einnehmen", t:PREP_SEC, type:"prep"}];
  if(ex.sides){
    T.phases.push({l:"Seite 1", t:ex.sec, type:"hold", side:1});
    T.phases.push({l:"Seite wechseln …", t:SWITCH_SEC, type:"switch"});
    T.phases.push({l:"Seite 2", t:ex.sec, type:"hold", side:2});
  }else{
    T.phases.push({l:"Halten & ruhig atmen", t:ex.sec, type:"hold"});
  }
  T.total = T.phases.reduce((a,p) => a + p.t, 0);
  T.i = 0; T.phaseRem = T.phases[0].t;
  if(autostart) runTimer();
}
function runTimer(){
  App.audio.unlock();
  T.running = true; T.started = true; T.lastSec = null;
  T.startTs = performance.now();
  stopLoops();
  T.iv = setInterval(tick, 250);
  const frame = () => { tick(); if(T.running) T.raf = requestAnimationFrame(frame); };
  T.raf = requestAnimationFrame(frame);
}
function alertSignal(){
  App.audio.beep(880, 0.7, 0.5);
  App.vibrate(500);
}
function tick(){
  if(!T.running) return;
  const el = (performance.now() - T.startTs) / 1000;
  if(el >= T.total){
    T.finished = true; T.running = false; T.i = T.phases.length - 1; T.phaseRem = 0;
    stopLoops();
    alertSignal();                       /* Ende der letzten Haltezeit */
    updateTimerUI(); return;
  }
  let acc = 0, idx = 0;
  while(idx < T.phases.length - 1 && el >= acc + T.phases[idx].t){ acc += T.phases[idx].t; idx++; }
  let changed = false;
  if(idx !== T.i){
    /* Signal, wenn eine Halte- oder Wechselphase abgelaufen ist (nicht nach der Vorbereitung) */
    const prevType = T.phases[T.i].type;
    if(prevType === "hold" || prevType === "switch") alertSignal();
    T.i = idx; T.lastSec = null; changed = true;
  }
  const ph = T.phases[idx], inPhase = el - acc;
  T.phaseRem = ph.t - inPhase;
  const secs = Math.ceil(T.phaseRem);
  if(secs !== T.lastSec){ T.lastSec = secs; changed = true; }
  if(changed) updateTimerUI();
  if(barEl) barEl.style.transform = "scaleX(" + Math.min(1, inPhase / ph.t).toFixed(4) + ")";
}
function updateTimerUI(){
  if(!timeEl || App.screen !== "play" || !T.phases.length) return;
  const ph = T.phases[T.i];
  const secs = Math.ceil(Math.max(0, T.phaseRem));
  const txt = App.fmt.time(secs).replace(/^0/, "");
  if(txt !== lastTimeTxt){ timeEl.textContent = txt; lastTimeTxt = txt; }
  const prep = ph.type === "prep" && !T.finished;
  timeEl.classList.toggle("prep", prep);
  timeEl.classList.toggle("switch", ph.type === "switch" && !T.finished);
  document.getElementById("tbarWrap").classList.toggle("prep", prep);
  let label;
  if(T.finished) label = "✅ Zeit abgelaufen – gut gemacht!";
  else if(!T.started) label = "Bereit";
  else label = ph.l + (ph.type === "hold" && ph.side ? ` (${ph.side}/2)` : "");
  if(label !== lastPhaseTxt){ phaseEl.textContent = label; lastPhaseTxt = label; }
  if(T.finished) barEl.style.transform = "scaleX(1)";
  else if(!T.started) barEl.style.transform = "scaleX(0)";
  const nb = document.querySelector('[data-a="next"]');
  if(nb) nb.classList.toggle("pulse", T.finished);
}
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && T.running) tick();
});

/* ---------- Navigation ---------- */
function openExercise(i, autostart){
  if(!N) return;
  S.current = Math.max(0, Math.min(N-1, i));
  save(); setupTimer(autostart); App.go("play");
}
/* Beendet der nächste Klick das gesamte Programm? */
function isFinishing(){
  if(!S.done.includes(S.current)) return S.done.length === N - 1;
  return S.done.length >= N && S.current === N - 1;
}
function nextExercise(){
  if(isFinishing()){
    const firstTime = !S.done.includes(S.current);
    if(firstTime) S.done.push(S.current);
    save(); setupTimer(false); App.go("home");
    if(firstTime) App.toast("🎉 Alle Übungen geschafft!", "success");
    return;
  }
  if(!S.done.includes(S.current)) S.done.push(S.current);
  let next = -1;
  if(S.done.length >= N){
    next = S.current + 1;                   /* Wiederholungsrunde: einfach der Reihe nach */
  }else{
    for(let k = 1; k <= N; k++){ const j = (S.current + k) % N; if(!S.done.includes(j)){ next = j; break; } }
  }
  openExercise(next < 0 ? 0 : next, true);
}
function startButtonAction(){
  if(!N) return;
  if(S.done.length >= N) return openExercise(0, true);
  let i = S.done.includes(S.current) ? LIST.findIndex((_, k) => !S.done.includes(k)) : S.current;
  openExercise(i < 0 ? 0 : i, true);
}

/* ---------- Screens ---------- */
function renderHome(){
  App.wake.off();
  timeEl = barEl = phaseEl = null;
  const allDone = N > 0 && S.done.length >= N;
  const label = allDone ? "Noch einmal durchgehen" : (S.done.length > 0 ? "Weitermachen" : "Beginnen");

  const rows = N ? LIST.map((e, i) => {
    const done = S.done.includes(i);
    return `<button class="player tap ${i === S.current && !done ? "cur" : ""}" data-a="open" data-i="${i}">
      <div class="avatar ${done ? "done" : ""}">${done ? "✓" : i + 1}</div>
      <div class="grow"><div class="pname">${App.esc(e.name)}</div><div class="psub">${App.esc(e.area)}</div></div>
      <div class="pts right">${e.sides ? "2×" + e.sec : e.sec} s</div>
    </button>`;
  }).join("") : App.ui.empty("Keine Übungen geladen.");

  App.render(
    App.ui.topbar([], { info: true }) +
    App.ui.header("DEHNEN", "Dehnübungen für jeden Tag") +
    App.ui.missingFile("dehnen-uebungen.js", EX_OK) +
    (allDone ? App.ui.okbox("🎉 Geschafft! Morgen ab 3:00 Uhr geht es von vorn los.", true) : "") +
    App.ui.card(`Heute (${S.done.length} von ${N})`,
      `<div class="bar"><div style="transform:scaleX(${N ? S.done.length / N : 0})"></div></div>${rows}`) +
    App.ui.storageCard([{
      kind: "resetDay",
      run: () => { S.done = []; S.current = 0; save(); }
    }]) +
    App.ui.bottom(App.ui.btn("▶ " + label, { block: true, action: "start", disabled: !N }))
  );
}

function renderRules(){
  App.wake.off();
  timeEl = barEl = phaseEl = null;
  App.render(App.ui.rules({
    sub: "So funktioniert das Dehnprogramm",
    sections: [
      { h: "🎯 Idee",
        p: `Jeden Tag ${N} Übungen für Rücken und Beine – eine nach der anderen, geführt vom Timer.` },
      { h: "⏱️ Timer",
        ul: [
          "Mit „Beginnen“ startet die erste Übung.",
          `Vor jeder Übung gibt es ${PREP_SEC} Sekunden Vorbereitung, dann läuft die Haltezeit.`,
          `Bei Übungen mit zwei Seiten gibt es dazwischen ${SWITCH_SEC} Sekunden zum Wechseln.`,
          `Der Timer lässt sich nicht pausieren, aber jederzeit zurücksetzen. Dann beginnt er wieder mit ${PREP_SEC} Sekunden Vorbereitung.`,
          "Während einer Übung bleibt das Display an."
        ] },
      { h: "✅ Fortschritt",
        ul: [
          "„Erledigt & weiter“ speichert die Übung und startet die nächste.",
          "Im Menü kannst du jede Übung direkt antippen.",
          "Ein neuer Tag beginnt um 3:00 Uhr nachts. Dann wird der Fortschritt vom Vortag ungültig."
        ] }
    ]
  }));
}

function renderPlay(){
  App.wake.on();
  const ex = LIST[S.current], isDone = S.done.includes(S.current);
  const finishing = isFinishing();
  const nextLabel = finishing
    ? (isDone ? "✓ Beenden" : "✓ Erledigt & beenden")
    : (isDone ? "Weiter →" : "✓ Erledigt & weiter");

  App.render(
    App.ui.topbar(null, { menu: true }) +
    App.ui.progress(N, LIST.map((_, i) => S.done.includes(i)), S.current) +
    `<div class="head" style="margin-top:var(--sp-14)">
      <div class="muted">Übung ${S.current + 1} von ${N}</div>
      <div class="big">${App.esc(ex.name)}</div>
    </div>` +
    App.ui.card("", figureSVG(ex.pose), "figure") +
    App.ui.card("",
      `<div class="phase" id="phase"></div>
       <div class="time" id="time">0:00</div>
       <div class="tbar" id="tbarWrap"><div id="tbar"></div></div>` +
       App.ui.btn("↻ Timer zurücksetzen", { kind: "ghost", block: true, action: "restart" }),
      "timer") +
    App.ui.card("So geht’s", `<p>${App.esc(ex.text)}</p>`, "rules") +
    App.ui.bottom(
      App.ui.stepBack("Vorherige Übung", { grow: true, disabled: S.current === 0 }) +
      App.ui.btn(nextLabel, { kind: "ok", grow2: true, action: "next" }),
      "cols")
  );
  barEl = document.getElementById("tbar");
  timeEl = document.getElementById("time");
  phaseEl = document.getElementById("phase");
  lastTimeTxt = ""; lastPhaseTxt = "";
  updateTimerUI();
  if(T.running) tick();
}

/* ---------- Aktionen ---------- */
App.on((a, el, i) => {
  switch(a){
    case "start":   startButtonAction(); break;
    case "open":    openExercise(i, true); break;
    case "menu":    setupTimer(false); App.go("home"); return true;
    case "restart": setupTimer(true); App.refresh(); break;   /* startet wieder mit der Vorbereitungszeit */
    case "prev":    if(S.current > 0) openExercise(S.current - 1, true); break;
    case "next":    nextExercise(); break;
  }
});

/* ---------- Start: es läuft nichts, erst „Beginnen“ startet die erste Übung ---------- */
App.screens({ home: renderHome, rules: renderRules, play: renderPlay }, { home: "home" });
save();
setupTimer(false);
App.go("home");
</script>
</body>
</html>
