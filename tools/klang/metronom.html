<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Metronom</title>
<script src="/common.js"></script>
<style>
.tc{text-align:center}
.mt{margin-top:var(--sp-14)}
.mt-s{margin-top:var(--sp-12)}

/* große Zahl */
.bignum{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{color:var(--muted);font-size:var(--fs-text);font-weight:600;margin-top:2px}
.btn.small{padding:var(--sp-10) var(--sp-14);font-size:var(--fs-base);border-radius:var(--r-small)}

/* Schieberegler */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:var(--r-pill);
  background:var(--card2);border:1px solid var(--line);outline:none;margin:var(--sp-16) 0 var(--sp-4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--grad);border:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--a1);border:0}

/* Taktpunkte */
.dots{display:flex;flex-wrap:wrap;gap:var(--sp-10);justify-content:center;margin:var(--sp-6) 0 var(--sp-14);min-height:30px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--line);
  transition:transform .08s,background .08s}
.dot.on{background:var(--grad);transform:scale(1.3)}
.dot.first.on{background:var(--grad-ok)}

@media (max-width:360px){.bignum{font-size:64px}}
@media (prefers-reduced-motion:reduce){.dot{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { ui } = App;

const KEY = "klang_metronom";
const DEF = { bpm: 100, beats: 4, loud: false };
const VOL_NORMAL = 0.5, VOL_LOUD = 0.85;

/* Das Tempo startet immer bei 100 BPM und wird nicht gespeichert */
const st = App.store.create(KEY, {
  defaults: { beats: DEF.beats, loud: DEF.loud },
  validate: d => d && typeof d === "object"
});

let bpm = DEF.bpm, beats = DEF.beats, loud = DEF.loud;
let running = false, ctx = null, nextTime = 0, beat = 0, timer = null, raf = null;
const queue = [];

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const vol = () => loud ? VOL_LOUD : VOL_NORMAL;

App.store.check();
{
  const d = st.load();
  beats = clamp(Number(d.beats) || DEF.beats, 1, 12);
  loud = d.loud === true;
}
const save = () => st.save({ beats, loud });

function tempoName(b) {
  return b < 60 ? "Largo" : b < 76 ? "Adagio" : b < 108 ? "Andante" : b < 120 ? "Moderato"
    : b < 156 ? "Allegro" : b < 176 ? "Vivace" : "Presto";
}

/* ---------- Screens ---------- */
function renderHome() {
  const dots = Array.from({ length: beats }, (_, i) =>
    `<div class="dot ${i === 0 ? "first" : ""}"></div>`).join("");

  const tempo = ui.card("Tempo", `<div class="tc">
      <div class="bignum" id="bpm">${bpm}</div>
      <div class="unit">BPM · <span id="tname">${tempoName(bpm)}</span></div>
      <div class="row mt">
        ${[-5, -1, 1, 5].map(d => ui.btn(App.fmt.signed(d).replace("-", "−"),
          { kind: "ghost", grow: true, action: "bpm", i: d, cls: "small" })).join("")}
      </div>
      <input type="range" id="slider" min="20" max="300" value="${bpm}" aria-label="Tempo">
      <div class="mt-s">${ui.btn("👆 Tempo antippen", { kind: "ghost", block: true, action: "tap" })}</div>
    </div>`);

  const takt = ui.card("Takt", `
      <div class="dots">${dots}</div>
      <div class="setting">
        <div><b>Schläge pro Takt</b><span>1 bis 12</span></div>
        ${ui.stepper(beats, { dec: "beats-dec", inc: "beats-inc" })}
      </div>
      ${ui.hint("Der erste Schlag jedes Takts klingt höher.")}`);

  const volume = ui.settings([{
    type: "switch",
    title: "Lauter",
    desc: "Aktuell " + Math.round(vol() * 100) + " % · normal 50 %, eingeschaltet 85 %",
    on: loud,
    action: "loud",
    label: "Lautstärke erhöhen"
  }], "Lautstärke");

  const storage = ui.storageCard([{
    kind: "clearAll",
    run: () => {
      st.remove();
      bpm = DEF.bpm; beats = DEF.beats; loud = DEF.loud;
      if (beat >= beats) beat = 0;
    }
  }]);

  const bar = ui.bottom(ui.btn(running ? "■ Stopp" : "▶ Start",
    { block: true, action: "toggle", kind: running ? "bad" : "" }));

  App.render(
    ui.topbar([{ label: "🎵 Klang-Tools", href: "../klang.html" }]) +
    ui.header("METRONOM", "Gleichmäßiger Takt für jedes Tempo") +
    tempo + takt + volume + storage + bar
  );
}

/* ---------- Anzeige ohne Neuaufbau (wichtig beim Ziehen des Reglers) ---------- */
function setBpm(v) {
  bpm = clamp(Math.round(v), 20, 300);
  const b = document.getElementById("bpm");
  if (!b) return;
  b.textContent = bpm;
  document.getElementById("tname").textContent = tempoName(bpm);
  document.getElementById("slider").value = bpm;
}

function stepBpm(d) {
  const t = bpm + d;
  if (t > 300) App.toast("Maximum erreicht: 300 BPM", "warn", 2000);
  else if (t < 20) App.toast("Minimum erreicht: 20 BPM", "warn", 2000);
  setBpm(t);
}

function setBeats(v) {
  if (v > 12) { App.toast("Maximal 12 Schläge pro Takt", "warn", 2000); return; }
  if (v < 1) { App.toast("Mindestens 1 Schlag pro Takt", "warn", 2000); return; }
  beats = v;
  if (beat >= beats) beat = 0;
  save();
  App.refresh();
}

/* ---------- Klang ---------- */
function click(time, accent) {
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = accent ? 1600 : 1000;
  const peak = Math.max(0.0002, vol());
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(time); osc.stop(time + 0.09);
}

function scheduler() {
  while (nextTime < ctx.currentTime + 0.12) {
    click(nextTime, beat === 0);
    queue.push({ t: nextTime, b: beat });
    nextTime += 60 / bpm;
    beat = (beat + 1) % beats;
  }
}

function flash(b) {
  const ds = document.querySelectorAll(".dot");
  ds.forEach(d => d.classList.remove("on"));
  if (ds[b]) {
    ds[b].classList.add("on");
    setTimeout(() => ds[b] && ds[b].classList.remove("on"), 110);
  }
}

function draw() {
  if (!running) return;
  while (queue.length && queue[0].t <= ctx.currentTime) flash(queue.shift().b);
  raf = requestAnimationFrame(draw);
}

/* ---------- Start / Stopp ---------- */
async function start() {
  try {
    if (!ctx) { const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    await ctx.resume();
  } catch (e) {
    App.toast("Audio wird von diesem Browser nicht unterstützt", "warn", 4000);
    return;
  }
  running = true; beat = 0; queue.length = 0;
  nextTime = ctx.currentTime + 0.08;
  scheduler();
  timer = setInterval(scheduler, 25);
  raf = requestAnimationFrame(draw);
  App.wake.on();
  App.refresh();
  App.toast("Metronom gestartet · " + bpm + " BPM", "success", 1800);
}

function stop() {
  running = false;
  clearInterval(timer); timer = null;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  queue.length = 0;
  App.wake.off();
  App.refresh();
  App.toast("Metronom gestoppt", "info", 1500);
}

/* ---------- Tempo antippen ---------- */
let taps = [];
function tapTempo() {
  const now = performance.now();
  if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if (taps.length > 6) taps.shift();
  if (taps.length === 1) { App.toast("Weiter im Takt antippen …", "info", 1800); return; }
  const gaps = [];
  for (let i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
  setBpm(60000 / (gaps.reduce((a, b) => a + b, 0) / gaps.length));
}

/* ---------- Ereignisse ---------- */
App.on((a, el, i) => {
  switch (a) {
    case "bpm": stepBpm(i); return true;
    case "tap": tapTempo(); return true;
    case "beats-dec": setBeats(beats - 1); return true;
    case "beats-inc": setBeats(beats + 1); return true;
    case "loud": loud = !loud; save(); App.refresh(); return true;
    case "toggle": running ? stop() : start(); return true;
  }
});

document.addEventListener("input", e => {
  if (e.target.id === "slider") setBpm(Number(e.target.value));
});

App.screens({ home: renderHome });
App.go("home");
</script>
</body>
</html>
