<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Metronom</title>
<script src="/toast.js"></script>
<style>
:root{
  --bg:#0b0d12; --card:#151922; --card2:#1c2230; --line:#262d3d;
  --text:#f2f4f8; --muted:#8c95a8;
  --a1:#ff3b6b; --a2:#7c5cff;
  --grad:linear-gradient(135deg,var(--a1),var(--a2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
body{min-height:100vh;
  background:
    radial-gradient(600px 300px at 10% -5%,rgba(255,59,107,.18),transparent 60%),
    radial-gradient(600px 300px at 100% 0%,rgba(124,92,255,.2),transparent 60%),
    var(--bg);
  background-attachment:fixed;touch-action:manipulation;overscroll-behavior-y:contain}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 110px);}
header{text-align:center;margin-bottom:14px}
.logo{font-size:30px;font-weight:900;letter-spacing:3px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.35)}
.card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700}
.center{text-align:center}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.nav{margin-bottom:14px}
button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
a{color:inherit;text-decoration:none}
.btn{display:inline-block;text-align:center;background:var(--grad);color:#fff;font-weight:700;border-radius:14px;padding:14px 18px;font-size:16px;
  transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
.btn.stop{background:linear-gradient(135deg,#ff3b6b,#c9162f)}
.btn.small{padding:10px 14px;font-size:15px;border-radius:12px}
.bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
  background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:10}
.bottom .inner{max-width:480px;margin:0 auto;display:flex;gap:10px}
.bottom .inner .btn{flex:1}
.hint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px;line-height:1.4}
.muted{color:var(--muted)}

/* große Zahl */
.num{font-size:84px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.05}
.unit{color:var(--muted);font-size:14px;font-weight:600;margin-top:2px}
.num.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Schieberegler */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:99px;
  background:var(--card2);border:1px solid var(--line);outline:none;margin:16px 0 4px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--grad);border:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--a1);border:0}

/* Taktpunkte */
.dots{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:6px 0 14px;min-height:30px}
.dot{width:24px;height:24px;border-radius:50%;background:var(--card2);border:1px solid var(--line);transition:transform .08s,background .08s}
.dot.on{background:var(--grad);transform:scale(1.3)}
.dot.first.on{background:linear-gradient(135deg,#1fcf8a,#16a0c9)}

/* Einstellungen (Toggle) */
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0}
.setting b{display:block;font-size:15px}
.setting span{color:var(--muted);font-size:12px}
.switch{width:54px;height:32px;border-radius:99px;background:var(--card2);border:1px solid var(--line);
  position:relative;flex:none;transition:background .25s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:#fff;transition:transform .25s}
.switch.on{background:var(--grad);border-color:transparent}
.switch.on::after{transform:translateX(22px)}

@media (max-width:360px){.num{font-size:64px}}
</style>
</head>
<body>
<div id="app">
  <div class="row nav">
    <a class="btn ghost grow" href="/index.html">⬅️ Home</a>
    <a class="btn ghost grow" href="../klang.html">🎵 Klang-Tools</a>
  </div>
  <header>
    <div class="logo">METRONOM</div>
    <div class="sub">Gleichmäßiger Takt für jedes Tempo</div>
  </header>

  <div class="card center">
    <h2>Tempo</h2>
    <div class="num grad" id="bpm">100</div>
    <div class="unit">BPM · <span id="tname">Moderato</span></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost grow small" data-d="-5">−5</button>
      <button class="btn ghost grow small" data-d="-1">−1</button>
      <button class="btn ghost grow small" data-d="1">+1</button>
      <button class="btn ghost grow small" data-d="5">+5</button>
    </div>
    <input type="range" id="slider" min="20" max="300" value="100" aria-label="Tempo">
    <button class="btn ghost block" id="tap" style="margin-top:12px">👆 Tempo antippen</button>
  </div>

  <div class="card center">
    <h2>Takt</h2>
    <div class="dots" id="dots"></div>
    <div class="row">
      <button class="btn ghost small" id="bm">−</button>
      <div class="grow"><b id="bn" style="font-size:22px">4</b><div class="muted" style="font-size:12px">Schläge pro Takt</div></div>
      <button class="btn ghost small" id="bp">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Lautstärke</h2>
    <div class="setting">
      <div><b>Lauter</b><span id="voltxt">Aktuell 50 %</span></div>
      <button class="switch" id="loud" role="switch" aria-checked="false" aria-label="Lautstärke erhöhen"></button>
    </div>
    <div class="hint">Normal 50 % · eingeschaltet 85 %. Der erste Schlag jedes Takts klingt höher.</div>
  </div>

  <div class="card">
    <h2>Speicher</h2>
    <div class="row">
      <button class="btn ghost grow" id="clear">Gespeicherte Daten löschen</button>
    </div>
    <div class="hint" id="storetxt"></div>
  </div>

  <div class="bottom"><div class="inner">
    <button class="btn" id="go">▶ Start</button>
  </div></div>
</div>

<script>
const $ = id => document.getElementById(id);
const KEY = "klang_metronom";
const DEF = { bpm: 100, beats: 4, loud: false };
const VOL_NORMAL = 0.5, VOL_LOUD = 0.85;

/* Das Tempo startet immer bei 100 BPM und wird nicht gespeichert */
let bpm = DEF.bpm, beats = DEF.beats, loud = DEF.loud;
let running = false, ctx = null, nextTime = 0, beat = 0, timer = null, raf = null, wake = null;
let storageOk = true;
const queue = [];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const vol = () => loud ? VOL_LOUD : VOL_NORMAL;

try{
  const d = JSON.parse(localStorage.getItem(KEY) || "{}");
  if(d.beats) beats = clamp(Number(d.beats) || DEF.beats, 1, 12);
  loud = d.loud === true;
}catch(e){}

const save = () => {
  try{ localStorage.setItem(KEY, JSON.stringify({ beats, loud })); storageOk = true; }
  catch(e){ storageOk = false; }
  renderStore();
};

function tempoName(b){
  return b < 60 ? "Largo" : b < 76 ? "Adagio" : b < 108 ? "Andante" : b < 120 ? "Moderato"
       : b < 156 ? "Allegro" : b < 176 ? "Vivace" : "Presto";
}
function renderDots(){
  $("dots").innerHTML = Array.from({length: beats}, (_, i) => `<div class="dot ${i === 0 ? "first" : ""}"></div>`).join("");
  $("bn").textContent = beats;
}
function renderTempo(){
  $("bpm").textContent = bpm;
  $("tname").textContent = tempoName(bpm);
  $("slider").value = bpm;
}
function renderLoud(){
  $("loud").classList.toggle("on", loud);
  $("loud").setAttribute("aria-checked", String(loud));
  $("voltxt").textContent = "Aktuell " + Math.round(vol() * 100) + " %";
}
function renderStore(){
  $("storetxt").textContent = storageOk
    ? "💾 Gespeichert werden Schläge pro Takt und Lautstärke, nur lokal auf diesem Gerät. Das Tempo startet immer bei 100 BPM."
    : "⚠️ Speichern nicht möglich (nur bis zum Neuladen)";
}
function setBpm(v){ bpm = clamp(Math.round(v), 20, 300); renderTempo(); }
function stepBpm(d){
  const t = bpm + d;
  if(t > 300) toast("Maximum erreicht: 300 BPM", "warn", 2000);
  else if(t < 20) toast("Minimum erreicht: 20 BPM", "warn", 2000);
  setBpm(t);
}
function setBeats(v){
  if(v > 12){ toast("Maximal 12 Schläge pro Takt", "warn", 2000); return; }
  if(v < 1){ toast("Mindestens 1 Schlag pro Takt", "warn", 2000); return; }
  beats = v;
  if(beat >= beats) beat = 0;
  renderDots(); save();
}

/* ---------- Klang ---------- */
function click(time, accent){
  const osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = "sine";
  osc.frequency.value = accent ? 1600 : 1000;
  const peak = Math.max(0.0002, vol());
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, time + 0.07);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(time); osc.stop(time + 0.09);
}
function scheduler(){
  while(nextTime < ctx.currentTime + 0.12){
    click(nextTime, beat === 0);
    queue.push({t: nextTime, b: beat});
    nextTime += 60 / bpm;
    beat = (beat + 1) % beats;
  }
}
function flash(b){
  const ds = document.querySelectorAll(".dot");
  ds.forEach(d => d.classList.remove("on"));
  if(ds[b]){
    ds[b].classList.add("on");
    setTimeout(() => ds[b] && ds[b].classList.remove("on"), 110);
  }
}
function draw(){
  if(!running) return;
  while(queue.length && queue[0].t <= ctx.currentTime){ flash(queue.shift().b); }
  raf = requestAnimationFrame(draw);
}

/* ---------- Start / Stop ---------- */
async function requestWake(){
  try{ if("wakeLock" in navigator && !wake && !document.hidden) wake = await navigator.wakeLock.request("screen"); }catch(e){}
}
function releaseWake(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }

async function start(){
  try{
    if(!ctx){ const AC = window.AudioContext || window.webkitAudioContext; ctx = new AC(); }
    await ctx.resume();
  }catch(e){ toast("Audio wird von diesem Browser nicht unterstützt", "warn", 4000); return; }
  running = true; beat = 0; queue.length = 0;
  nextTime = ctx.currentTime + 0.08;
  scheduler();
  timer = setInterval(scheduler, 25);
  raf = requestAnimationFrame(draw);
  requestWake();
  $("go").textContent = "■ Stopp";
  $("go").classList.add("stop");
  toast("Metronom gestartet · " + bpm + " BPM", "success", 1800);
}
function stop(){
  running = false;
  clearInterval(timer); timer = null;
  if(raf){ cancelAnimationFrame(raf); raf = null; }
  queue.length = 0;
  document.querySelectorAll(".dot").forEach(d => d.classList.remove("on"));
  releaseWake();
  $("go").textContent = "▶ Start";
  $("go").classList.remove("stop");
  toast("Metronom gestoppt", "info", 1500);
}

/* ---------- Tap-Tempo ---------- */
let taps = [];
$("tap").addEventListener("click", () => {
  const now = performance.now();
  if(taps.length && now - taps[taps.length - 1] > 2000) taps = [];
  taps.push(now);
  if(taps.length > 6) taps.shift();
  if(taps.length === 1){ toast("Weiter im Takt antippen …", "info", 1800); return; }
  const gaps = [];
  for(let i = 1; i < taps.length; i++) gaps.push(taps[i] - taps[i - 1]);
  const avg = gaps.reduce((a, b) => a + b, 0) / gaps.length;
  setBpm(60000 / avg);
});

/* ---------- Speicher: Sicherheitsabfrage (zweiter Tipp bestätigt) ---------- */
let armed = false, armedT = null;
const CLEAR_TXT = "Gespeicherte Daten löschen";
function disarm(){
  clearTimeout(armedT); armed = false;
  $("clear").textContent = CLEAR_TXT;
}
$("clear").addEventListener("click", () => {
  if(!armed){
    armed = true;
    $("clear").textContent = "Sicher? Nochmal tippen";
    armedT = setTimeout(disarm, 4000);
    return;
  }
  disarm();
  try{ localStorage.removeItem(KEY); }catch(e){}
  bpm = DEF.bpm; beats = DEF.beats; loud = DEF.loud;
  if(beat >= beats) beat = 0;
  renderTempo(); renderDots(); renderLoud(); renderStore();
  toast("Gespeicherte Daten gelöscht", "info", 2000);
});

/* ---------- Events ---------- */
document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => stepBpm(Number(b.dataset.d))));
$("slider").addEventListener("input", e => setBpm(Number(e.target.value)));
$("bm").addEventListener("click", () => setBeats(beats - 1));
$("bp").addEventListener("click", () => setBeats(beats + 1));
$("loud").addEventListener("click", () => { loud = !loud; renderLoud(); save(); });
$("go").addEventListener("click", () => running ? stop() : start());
document.addEventListener("visibilitychange", () => { if(!document.hidden && running) requestWake(); });

renderDots(); renderTempo(); renderLoud(); renderStore();
</script>
</body>
</html>
