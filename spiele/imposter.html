<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Imposter</title>
<!-- Gemeinsame Bausteine (muss das erste Skript sein) -->
<script src="/common.js"></script>
<style>
  /* Nur Imposter-spezifisch, alles andere kommt aus common.js */
  .secret{border-radius:26px;padding:34px 20px;min-height:260px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:var(--sp-10);border:1px solid var(--line);background:var(--card);
    -webkit-user-select:none;user-select:none;transition:transform var(--t-fade)}
  .secret:active{transform:scale(.98)}
  .secret.hidden{background:repeating-linear-gradient(45deg,var(--card),var(--card) 12px,var(--card2) 12px,var(--card2) 24px)}
  .secret .emoji{font-size:54px}
  .secret .word{font-size:34px;font-weight:900;word-break:break-word}
  .secret.imp{border-color:var(--a1);box-shadow:0 0 40px rgba(var(--a1-rgb),.35)}
  .secret.imp .word{color:var(--a1)}
  .secret.crew{border-color:var(--ok);box-shadow:0 0 40px rgba(var(--ok-rgb),.2)}
  .tag.bigtag{font-size:var(--fs-stat);padding:var(--sp-8) 20px;font-weight:800}
  .impname{display:inline-block;margin:var(--sp-4);padding:var(--sp-8) var(--sp-14);border-radius:var(--r-pill);
    background:var(--bad-bg);border:1px solid var(--a1);font-weight:700}
  @media (prefers-reduced-motion:reduce){.secret{transition:none}}
</style>
<!-- Wörter aus extra Datei (muss im selben Ordner liegen) -->
<script src="imposter-woerter.js"></script>
</head>
<body>
<div id="app"></div>

<script>
const { ui, esc } = App;

/* ---------- Wörter laden (aus imposter-woerter.js) ---------- */
const WORDS_OK = (typeof WORDS !== "undefined") && App.isFilled(WORDS);
const WORD_LIST = WORDS_OK ? WORDS : [];

/* ---------- State ---------- */
const S = {
  players: [],      // [{name, points}]
  hint: true,
  imposters: 1,
  game: null,
  gains: []
};

/* ---------- Speicher: nur lokal (localStorage), Format wie bisher ---------- */
const store = App.store.create("imposter_data", {
  defaults: { players: [], hint: true, imposters: 1 },
  encode: s => ({
    p: s.players.map(p => [p.name, p.points]),
    h: s.hint ? 1 : 0,
    i: s.imposters
  }),
  decode: d => ({
    players: (d.p || []).map(x => ({ name: String(x[0]), points: Number(x[1]) || 0 })),
    hint: d.h !== 0,
    imposters: Math.max(1, Number(d.i) || 1)
  }),
  validate: d => Array.isArray(d.players)
});

const save = () => store.save(S);

App.store.check();
Object.assign(S, store.load());

/* ---------- Helpers ---------- */
const maxImp = () => Math.max(1, Math.floor((S.players.length - 1) / 2));

/* ---------- Spiel starten ---------- */
function startGame(){
  const n = S.players.length;
  if(!WORDS_OK) return App.toast("Wörterdatei fehlt");
  if(!App.checkPlayers(n)) return;
  if(S.imposters > maxImp()) S.imposters = maxImp();
  const last = S.game ? S.game.word : null;
  let pick;
  do{ pick = WORD_LIST[Math.floor(Math.random() * WORD_LIST.length)]; }while(pick[0] === last && WORD_LIST.length > 1);
  const order = App.shuffle(S.players.map((_, i) => i));
  const imps = new Set(App.shuffle(S.players.map((_, i) => i)).slice(0, S.imposters));
  S.game = { word: pick[0], hint: pick[1], imps, order, idx: 0, revealed: false,
             starter: Math.floor(Math.random() * n) };
  save();
  App.go("reveal");
}

function finish(){
  S.players.forEach((p, k) => p.points += (S.gains[k] || 0));
  save();
  App.go("rank");
}

/* ---------- Screens ---------- */
function renderHome(){
  const n = S.players.length;
  App.render(
    ui.topbar(null, { info: true }) +
    ui.header("IMPOSTER", "Wer kennt das Wort nicht?") +
    ui.missingFile("imposter-woerter.js", WORDS_OK) +
    ui.playerCard({
      players: S.players,
      points: true,
      onAdd: name => { S.players.push({ name, points: 0 }); save(); },
      onDelete: i => {
        S.players.splice(i, 1);
        if(S.imposters > maxImp()) S.imposters = maxImp();
        save();
      }
    }) +
    ui.settings([
      { type: "switch", title: "Tipp für Imposter", desc: "Imposter bekommen ein Tipp-Wort", on: S.hint, action: "hint", label: "Tipp" },
      { type: "stepper", title: "Anzahl Imposter", desc: `Max. ${maxImp()} bei ${n} Spielern`,
        value: Math.min(S.imposters, maxImp()), dec: "impdec", inc: "impinc" }
    ]) +
    ui.storageCard([
      { kind: "resetPoints", run: () => { S.players.forEach(p => p.points = 0); save(); } },
      { kind: "clearAll", run: () => { S.players = []; S.imposters = 1; save(); } }
    ]) +
    ui.bottom(ui.btn("Spiel starten", { block: true, action: "start", disabled: n < 3 || !WORDS_OK }))
  );
}

function renderRules(){
  App.render(ui.rules({
    sub: "So funktioniert Imposter",
    sections: [
      { h: "🎯 Idee",
        p: "Alle Spieler bekommen dasselbe geheime Wort – außer dem Imposter. Er kennt das Wort nicht und muss so tun, als ob. Die Crew will den Imposter finden, der Imposter will unentdeckt bleiben." },
      { h: "📱 Vorbereitung",
        ul: [
          "Mindestens 3 Spieler eintragen.",
          "Anzahl der Imposter einstellen (maximal die Hälfte der Spieler, abgerundet und abzüglich eins).",
          "Tipp für Imposter ein- oder ausschalten."
        ] },
      { h: "🤫 Wörter verteilen",
        ol: [
          "Das Handy geht reihum. Der Spieler, dessen Name angezeigt wird, tippt auf die Karte.",
          "Crew-Mitglieder sehen das geheime Wort. Imposter sehen „IMPOSTER“.",
          "Ist der Tipp an, bekommt der Imposter zusätzlich ein einzelnes Tipp-Wort. Es ist nur ein vager Anhaltspunkt, nicht das geheime Wort selbst.",
          "Mit „Verstanden“ wird die Karte wieder verdeckt und das Handy weitergegeben."
        ] },
      { h: "💬 Diskussion",
        p: "Ein zufälliger Spieler beginnt. Danach sagt reihum jeder einen Begriff, der zum Wort passt, aber nicht zu offensichtlich ist. Ihr könnt frei diskutieren und Verdächtige befragen, so lange ihr wollt.",
        ul: [
          "Die Crew will zeigen, dass sie das Wort kennt, ohne es dem Imposter zu verraten.",
          "Der Imposter hört gut zu und versucht, sich unauffällig anzupassen."
        ] },
      { h: "🗳️ Abstimmung",
        p: "Wenn ihr euch sicher genug fühlt, stimmt ihr gemeinsam ab, wer der Imposter ist. Danach tippt ihr auf „Zur Auflösung“." },
      { h: "🏆 Punkte",
        ul: [
          "**Crew gewinnt** (Imposter enttarnt): +1 Punkt für jeden Crew-Spieler.",
          "**Imposter gewinnt** (nicht erwischt): +2 Punkte für jeden Imposter.",
          "Nach der Punktevergabe seht ihr das Ranking und könnt eine neue Runde starten."
        ] },
      { h: "💡 Tipps",
        ul: [
          "Mit mehreren Imposter ist es schwerer, sie alle zu finden.",
          "Namen und Punkte werden automatisch gespeichert."
        ] }
    ]
  }));
}

function renderReveal(){
  const g = S.game, n = g.order.length;
  const pi = g.order[g.idx];
  const name = S.players[pi].name;
  const isImp = g.imps.has(pi);
  let card;
  if(!g.revealed){
    card = `<div class="secret hidden" data-a="show">
      <div class="emoji">👆</div><div class="big">Tippen zum Aufdecken</div>
      <div class="muted">Nur du darfst schauen!</div></div>`;
  }else if(isImp){
    card = `<div class="secret imp">
      <div class="emoji">🕵️</div><div class="word">IMPOSTER</div>
      ${S.hint ? `<div class="muted">Dein Tipp</div><div class="tag bigtag">${esc(g.hint)}</div>`
               : `<div class="muted">Du kennst das Wort nicht. Tarne dich!</div>`}
    </div>`;
  }else{
    card = `<div class="secret crew">
      <div class="emoji">🔑</div><div class="muted">Das geheime Wort</div>
      <div class="word">${esc(g.word)}</div></div>`;
  }
  App.render(
    ui.topbar(null, { menu: true }) +
    `<div class="center">
      ${ui.progress(n, g.idx + 1)}
      <div>
        <div class="muted">Spieler ${g.idx + 1} von ${n}</div>
        <div class="big">${esc(name)}</div>
      </div>
      ${card}
      ${g.revealed
        ? ui.btn(g.idx + 1 < n ? "Verstanden – weitergeben" : "Verstanden – Spiel starten", { block: true, action: "next" })
        : `<div class="hint">Gib das Handy an <b>${esc(name)}</b></div>`}
    </div>`
  );
}

function renderPlay(){
  const g = S.game, n = S.players.length;
  const chips = Array.from({ length: n }, (_, k) => {
    const idx = (g.starter + k) % n;
    return ui.chip(`${k + 1}. ${S.players[idx].name}`, k === 0 ? "first" : "");
  }).join("");
  App.render(
    ui.topbar(null, { menu: true }) +
    `<div class="center">
      ${ui.header("DISKUSSION", `${g.imps.size} Imposter · Tipp ${S.hint ? "an" : "aus"}`, "md")}
      ${ui.card("", `
        <div class="muted">Es beginnt</div>
        <div class="big" style="margin:6px 0 10px">${esc(S.players[g.starter].name)}</div>
        <div class="muted" style="font-size:var(--fs-text)">Sagt reihum Begriffe zum Wort und diskutiert, so lange ihr wollt. Stimmt ab, sobald ihr bereit seid.</div>
        <div class="chips">${chips}</div>`, "")}
      ${ui.btn("Zur Auflösung", { block: true, action: "resolve" })}
    </div>`
  );
}

function renderResult(){
  const g = S.game;
  const imps = [...g.imps].map(i => `<span class="impname">🕵️ ${esc(S.players[i].name)}</span>`).join("");
  App.render(
    ui.topbar(null, { menu: true }) +
    `<div class="center">
      ${ui.header("AUFLÖSUNG", "", "md")}
      ${ui.card("", `
        <div class="muted">Das Wort war</div>
        <div class="big" style="margin:6px 0 4px">${esc(g.word)}</div>
        ${S.hint ? ui.tag("Tipp: " + g.hint) : ""}
        <div class="muted" style="margin:16px 0 6px">${g.imps.size > 1 ? "Die Imposter waren" : "Der Imposter war"}</div>
        <div>${imps}</div>`)}
      <div>
        <div class="muted" style="margin-bottom:var(--sp-10)">Wer hat gewonnen?</div>
        <div class="row">
          ${ui.btn("Crew", { kind: "ok", grow: true, action: "crewwin", sub: "+1 Punkt je Spieler", subLine: true })}
          ${ui.btn("Imposter", { kind: "bad", grow: true, action: "impwin", sub: "+2 Punkte je Imposter", subLine: true })}
        </div>
        <button class="link" data-a="nopoints">Ohne Punkte beenden</button>
      </div>
    </div>`
  );
}

function renderRank(){
  const rows = S.players.map((p, i) => ({ name: p.name, total: p.points, gain: S.gains[i] || 0 }));
  App.render(
    ui.topbar(null, { menu: true }) +
    ui.header("RANKING", "Aktueller Punktestand", "md") +
    ui.card("", ui.ranking(rows, { hideZero: true })) +
    ui.bottom(ui.btn("🔁 Noch eine Runde", { block: true, action: "again" }))
  );
}

/* ---------- Events ---------- */
App.on((a) => {
  switch(a){
    case "menu": S.game = null; break;   /* Rest übernimmt common.js (zurück zum Start) */
    case "hint": S.hint = !S.hint; save(); App.refresh(); break;
    case "impinc":
      if(S.imposters < maxImp()){ S.imposters++; save(); }
      else App.toast("Mehr Spieler für mehr Imposter nötig");
      App.refresh(); break;
    case "impdec": if(S.imposters > 1){ S.imposters--; save(); } App.refresh(); break;
    case "start":
    case "again": startGame(); break;
    case "show": S.game.revealed = true; App.refresh(); break;
    case "next":
      S.game.idx++; S.game.revealed = false;
      App.go(S.game.idx >= S.game.order.length ? "play" : "reveal");
      break;
    case "resolve": App.go("result"); break;
    case "crewwin":
      S.gains = S.players.map((p, k) => S.game.imps.has(k) ? 0 : 1);
      finish(); break;
    case "impwin":
      S.gains = S.players.map((p, k) => S.game.imps.has(k) ? 2 : 0);
      finish(); break;
    case "nopoints": S.gains = S.players.map(() => 0); finish(); break;
  }
});

/* ---------- Start ---------- */
App.screens({ home: renderHome, rules: renderRules, reveal: renderReveal, play: renderPlay, result: renderResult, rank: renderRank }, { home: "home" });
save();   /* Speicherstatus sofort prüfen */
App.go("home");
</script>
</body>
</html>
