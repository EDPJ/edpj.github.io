<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Wizard – Punktetafel</title>
<script src="/common.js"></script>
<style>
  /* Nur Wizard-spezifisches CSS. Alles andere kommt aus common.js */
  .roundhead{text-align:center;margin-bottom:var(--sp-12)}
  .roundhead header{margin-bottom:0}
  .roundhead .progress.small{margin:var(--sp-10) 0 var(--sp-4)}
  .roundhead .progress:not(.small){margin:var(--sp-10) 0 var(--sp-4)}
  .cards-n{margin-top:var(--sp-6);font-size:var(--fs-base);color:var(--muted)}
  .cards-n b{color:var(--text)}
  .roundinfo{margin-top:var(--sp-12)}
  .gamebtns{margin-top:var(--sp-12)}
  .sumline{display:flex;justify-content:space-between;font-size:var(--fs-text);color:var(--muted);padding:var(--sp-4) 2px 0}
  .sumline b{color:var(--text)}
  .ok-t{color:var(--ok)}
  .bad-t{color:var(--a1)}
  .tblwrap{overflow-x:auto;border-radius:var(--r-btn);border:1px solid var(--line);background:var(--card2)}
  table{border-collapse:collapse;width:100%;font-size:var(--fs-small)}
  th,td{padding:var(--sp-8);text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--card2)}
  th:first-child,td:first-child{position:sticky;left:0;background:var(--card2);text-align:left;z-index:1;border-right:1px solid var(--line)}
  tr.clk{cursor:pointer}
  tr.clk:active td{background:var(--row-active)}
  td .bw{font-size:var(--fs-xs);color:var(--muted)}
  td .sc{font-weight:800;font-variant-numeric:tabular-nums}
  td .pt{font-size:var(--fs-xs);font-weight:700}
  tr.tot td{font-weight:900;font-size:var(--fs-base);border-bottom:0}
</style>
</head>
<body>
<div id="app"></div>

<script>
const { ui, esc, fmt } = App;

/* ---------- Speicher: nur lokal (localStorage) ---------- */
const store = App.store.create("wizard", {
  defaults: { players: [], house: true, game: null },
  encode: d => ({ p: d.players, h: d.house ? 1 : 0, g: d.game }),
  decode: raw => {
    let game = raw.g || null;
    if (game && (!Array.isArray(game.rounds) || game.names?.length !== game.rounds[0]?.bids.length)) game = null;
    return { players: (raw.p || []).map(String), house: raw.h !== 0, game };
  },
  validate: d => Array.isArray(d.players)
});

/* ---------- State ---------- */
const S = Object.assign(store.load(), { from: "home", edit: null });
const save = () => store.save({ players: S.players, house: S.house, game: S.game });

/* ---------- Helfer ---------- */
const totalRounds = n => Math.floor(60 / n);
const pts = (b, w) => b === w ? 20 + 10 * w : -10 * Math.abs(b - w);
const names = () => S.game.names;
const gameActive = () => S.game && !S.game.finished;
const sum = a => a.reduce((x, y) => x + y, 0);

function totals(upTo){ // Summe über abgeschlossene Runden (optional bis Index)
  const g = S.game, n = g.names.length;
  const t = Array(n).fill(0);
  g.rounds.forEach((r, ri) => {
    if (!r.done || (upTo !== undefined && ri > upTo)) return;
    for (let i = 0; i < n; i++) t[i] += pts(r.bids[i], r.won[i]);
  });
  return t;
}

function newGame(){
  const n = S.players.length;
  if (!App.checkPlayers(n, 3, 6)) return;
  const R = totalRounds(n);
  S.game = {
    names: S.players.slice(),
    dealer0: Math.floor(Math.random() * n),
    cur: 0, phase: "bid", finished: false,
    rounds: Array.from({ length: R }, () => ({ bids: Array(n).fill(0), won: Array(n).fill(0), done: false }))
  };
  save();
  App.go("round");
}

const stp = (f, r, i, val, mini) =>
  ui.stepper(val, { action: "stp", data: { f, r, i }, mini: !!mini, label: mini ? (f === "bids" ? "Ansage" : "Stiche") : "" });

const nameRanking = (tot, gains, subs) =>
  ui.ranking(names().map((nm, i) => ({
    name: nm, total: tot[i],
    gain: gains ? gains[i] : null,
    sub: subs ? subs[i] : ""
  })));

/* ---------- Screens ---------- */
function renderHome(){
  const n = S.players.length;
  const active = gameActive();

  let gameCard = "";
  if (active) {
    const g = S.game, done = g.rounds.filter(r => r.done).length;
    gameCard = ui.card("Laufendes Spiel",
      `<div class="setting"><div><b>Runde ${g.cur + 1} von ${g.rounds.length}</b><span>${done} Runden abgeschlossen · ${g.names.length} Spieler</span></div></div>
       <div class="row gamebtns">
         ${ui.btn("📊 Punktetafel", { kind: "ghost", grow: true, action: "table" })}
         ${ui.btn("Spiel abbrechen", { kind: "ghost", grow: true, action: "abort", confirm: true })}
       </div>`);
  } else if (S.game && S.game.finished) {
    gameCard = ui.card("Letztes Spiel",
      ui.btn("🏆 Endergebnis ansehen", { kind: "ghost", block: true, action: "gotofinal" }));
  }

  const playerCard = ui.playerCard({
    players: S.players,
    locked: !!active,
    min: 3, max: 6,
    empty: "Noch keine Spieler. Füge 3 bis 6 hinzu.",
    hint: n >= 3 && n <= 6 ? `${totalRounds(n)} Runden bei ${n} Spielern` : "",
    onAdd: name => { S.players.push(name); save(); },
    onDelete: i => { S.players.splice(i, 1); save(); }
  });

  const settings = ui.settings([
    { type: "switch", title: "Hausregel", desc: "Warnung und Sperre, wenn Summe der Ansagen = Stichzahl", on: S.house, action: "house" }
  ]);

  const storage = ui.storageCard([
    { kind: "clearAll", run: () => { S.players = []; S.game = null; save(); } }
  ]);

  const bottom = ui.bottom(active
    ? ui.btn("Spiel fortsetzen", { block: true, action: "resume" })
    : ui.btn(n > 6 ? "Maximal 6 Spieler" : "Neues Spiel starten", { block: true, action: "start", disabled: n < 3 || n > 6 }));

  App.render(
    ui.topbar([], { info: true }) +
    ui.header("WIZARD", "Punktetafel für dein Kartenspiel") +
    gameCard + playerCard + settings + storage + bottom
  );
}

function renderRules(){
  App.render(ui.rules({
    sub: "So funktioniert Wizard",
    sections: [
      { h: "🎯 Idee", p: "Wizard ist ein Stichspiel. Vor jeder Runde sagt jeder an, wie viele Stiche er genau gewinnen wird. Wer richtig liegt, bekommt Punkte, wer danebenliegt, verliert welche." },
      { h: "🃏 Runden", ul: [
        "60 Karten: 52 normale, 4 Zauberer, 4 Narren.",
        "In Runde 1 bekommt jeder 1 Karte, in Runde 2 zwei Karten usw.",
        "3 Spieler = 20 Runden · 4 = 15 · 5 = 12 · 6 = 10.",
        "Der Geber wechselt jede Runde reihum. Links vom Geber wird zuerst angesagt."
      ] },
      { h: "🗣️ Ansage & Stiche", ol: [
        "Alle sagen ihre Stichzahl an. Trage sie in der App ein.",
        "Es wird gespielt. Danach trägst du ein, wie viele Stiche jeder tatsächlich gewonnen hat.",
        "Die Summe der Stiche muss der Kartenzahl der Runde entsprechen."
      ] },
      { h: "🏆 Punkte", ul: [
        "**Richtig angesagt:** 20 Punkte + 10 pro Stich.",
        "**Falsch angesagt:** −10 Punkte pro Stich Abweichung.",
        "**Beispiele:** Ansage 2, Stiche 2 = +40 · Ansage 0, Stiche 0 = +20 · Ansage 3, Stiche 1 = −20."
      ] },
      { h: "🏠 Hausregel", p: "Viele spielen so, dass die Summe aller Ansagen nicht der Stichzahl entsprechen darf (der Geber muss anpassen). Ist die Hausregel an, warnt die App und lässt dich erst weiter, wenn die Summe der Ansagen nicht mehr der Stichzahl entspricht." },
      { h: "💡 Tipps", ul: [
        "In der Punktetafel kannst du eine abgeschlossene Runde antippen und korrigieren.",
        "Mit „Vorherige Runde“ kommst du zur letzten Auswertung zurück.",
        "Alles wird automatisch auf diesem Gerät gespeichert."
      ] }
    ]
  }));
}

function renderRound(){
  const g = S.game, n = g.names.length, ri = g.cur, r = g.rounds[ri], cards = ri + 1;
  const dealer = (g.dealer0 + ri) % n;
  const order = Array.from({ length: n }, (_, k) => (dealer + 1 + k) % n);
  const topbar = ui.topbar([{ label: "📊 Punktetafel", action: "table" }], { menu: true });

  /* ----- Auswertung ----- */
  if (g.phase === "summary") {
    const gains = r.bids.map((b, i) => pts(b, r.won[i]));
    const subs = r.bids.map((b, i) => `Ansage ${b} · Stiche ${r.won[i]} ${b === r.won[i] ? "✅" : "❌"}`);
    const last = ri + 1 >= g.rounds.length;
    App.render(
      topbar +
      ui.header("AUSWERTUNG", `Runde ${ri + 1} · Zwischenstand`, "md") +
      ui.card("", nameRanking(totals(), gains, subs)) +
      ui.bottom(
        ui.btn(last ? "🏆 Zum Endergebnis" : "Nächste Runde →", { block: true, action: last ? "finish" : "nextround" }) +
        ui.stepBack("Stiche korrigieren", { block: true, action: "backtowon" }),
        "col")
    );
    return;
  }

  /* ----- Ansagen / Stiche ----- */
  const bidPhase = g.phase === "bid";
  const head = `<div class="roundhead">
      ${ui.header(`RUNDE ${ri + 1}`, `von ${g.rounds.length}`, "md")}
      ${ui.progress(g.rounds.length, g.rounds.map(rr => rr.done), ri)}
      <div class="cards-n">🃏 <b>${cards}</b> ${cards === 1 ? "Karte" : "Karten"} pro Spieler</div>
    </div>`;

  const rows = order.map(i => {
    if (bidPhase) {
      const tags = (i === dealer ? ui.tag("Geber", "inline dealer") : "") + (i === order[0] ? ui.tag("Beginnt", "inline start") : "");
      return `<div class="player">${ui.avatar(g.names[i])}<div class="grow pname">${esc(g.names[i])}${tags}</div>${stp("bids", ri, i, r.bids[i])}</div>`;
    }
    const p = pts(r.bids[i], r.won[i]);
    return `<div class="player">${ui.avatar(g.names[i])}
      <div class="grow"><div class="pname">${esc(g.names[i])}</div>
        <div class="psub">Ansage ${r.bids[i]} · <span class="${p < 0 ? "bad-t" : "ok-t"}">${fmt.signed(p)}</span></div></div>
      ${stp("won", ri, i, r.won[i])}</div>`;
  }).join("");

  let info = "", ready = true;
  if (bidPhase) {
    const s = sum(r.bids);
    ready = !(S.house && s === cards);
    if (!ready) info = ui.warnbox(`⚠️ Summe der Ansagen (${s}) = Stichzahl. Laut Hausregel muss der Geber (${esc(g.names[dealer])}) anders ansagen. Weiter ist erst möglich, wenn die Summe nicht mehr der Stichzahl entspricht.`);
    info += `<div class="sumline"><span>Summe Ansagen</span><b class="${ready ? "" : "bad-t"}">${s} / ${cards}</b></div>`;
  } else {
    const s = sum(r.won);
    ready = s === cards;
    info = `<div class="sumline"><span>Summe Stiche</span><b class="${ready ? "ok-t" : "bad-t"}">${s} / ${cards}</b></div>`;
  }

  const bottom = bidPhase
    ? (ri > 0
        ? ui.bottom(ui.btn("Weiter zu den Stichen", { block: true, action: "tostiche", disabled: !ready }) +
                    ui.stepBack("Vorherige Runde", { block: true, action: "prevround" }), "col")
        : ui.bottom(ui.btn("Weiter zu den Stichen", { block: true, action: "tostiche", disabled: !ready })))
    : ui.bottom(ui.btn("Runde auswerten", { block: true, action: "evaluate", disabled: !ready }) +
                ui.stepBack("Ansagen ändern", { block: true, action: "backtobid" }), "col");

  App.render(
    topbar + head +
    ui.card(bidPhase ? "1 · Ansagen" : "2 · Gewonnene Stiche", rows + `<div class="roundinfo">${info}</div>`) +
    bottom
  );
}

function renderTable(){
  const g = S.game;
  const doneIdx = g.rounds.map((r, i) => r.done ? i : -1).filter(i => i >= 0);
  const head = `<tr><th>Runde</th>${g.names.map(nm => `<th>${esc(nm.length > 7 ? nm.slice(0, 7) + "…" : nm)}</th>`).join("")}</tr>`;
  const body = doneIdx.map(ri => {
    const r = g.rounds[ri], cum = totals(ri);
    return `<tr class="clk" data-a="edit" data-r="${ri}"><td><b>${ri + 1}</b> <span class="bw">· ${ri + 1}🃏</span></td>
      ${g.names.map((_, i) => {
        const p = pts(r.bids[i], r.won[i]);
        return `<td><div class="bw">${r.bids[i]}/${r.won[i]}</div><div class="pt ${p < 0 ? "bad-t" : "ok-t"}">${fmt.signed(p)}</div><div class="sc">${cum[i]}</div></td>`;
      }).join("")}</tr>`;
  }).join("");
  const tot = totals();
  const totRow = `<tr class="tot"><td>Σ</td>${tot.map(t => `<td>${t}</td>`).join("")}</tr>`;

  App.render(
    ui.back("tableback") +
    ui.header("PUNKTETAFEL", "Ansage/Stiche · Punkte · Zwischenstand", "md") +
    (doneIdx.length
      ? `<div class="tblwrap"><table>${head}${body}${totRow}</table></div>` +
        ui.hint("Tippe auf eine Runde, um sie zu korrigieren.") +
        `<div style="margin-top:var(--sp-14)">${ui.card("Ranking", nameRanking(tot))}</div>`
      : ui.card("", ui.empty("Noch keine Runde abgeschlossen.")))
  );
}

function renderEdit(){
  const g = S.game, ri = S.edit, r = g.rounds[ri], cards = ri + 1;
  const rows = g.names.map((nm, i) => {
    const p = pts(r.bids[i], r.won[i]);
    return `<div class="player">${ui.avatar(nm)}
      <div class="grow"><div class="pname">${esc(nm)}</div><div class="psub"><span class="${p < 0 ? "bad-t" : "ok-t"}">${fmt.signed(p)}</span></div></div>
      ${stp("bids", ri, i, r.bids[i], true)}${stp("won", ri, i, r.won[i], true)}</div>`;
  }).join("");
  const s = sum(r.won), ready = s === cards;

  App.render(
    ui.back("table", "Zur Punktetafel") +
    ui.header(`RUNDE ${ri + 1} KORRIGIEREN`, `${cards} ${cards === 1 ? "Karte" : "Karten"} pro Spieler`, "md") +
    ui.card("", rows +
      `<div class="roundinfo"><div class="sumline"><span>Summe Stiche</span><b class="${ready ? "ok-t" : "bad-t"}">${s} / ${cards}</b></div></div>`) +
    ui.bottom(ui.btn("Speichern", { block: true, action: "table", disabled: !ready }))
  );
}

function renderFinal(){
  const g = S.game, tot = totals();
  const max = Math.max(...tot);
  const winners = g.names.filter((_, i) => tot[i] === max);
  App.render(
    ui.topbar(null, { menu: true }) +
    ui.header("ENDERGEBNIS", `${g.rounds.length} Runden gespielt`, "md") +
    ui.okbox(`🧙 Gewinner: <b>${winners.map(esc).join(", ")}</b> mit ${max} Punkten`, true) +
    ui.card("", nameRanking(tot)) +
    ui.bottom(
      ui.btn("📊 Punktetafel ansehen", { block: true, action: "table" }) +
      ui.stepBack("Zur letzten Runde", { block: true, action: "backfromfinal" }),
      "col")
  );
}

/* ---------- Events ---------- */
App.on((a, el, i) => {
  const r = Number(el.dataset.r);
  switch (a) {
    case "house": S.house = !S.house; save(); App.refresh(); break;
    case "start": newGame(); break;
    case "resume": App.go("round"); break;
    case "gotofinal": App.go("final"); break;
    case "abort":
      S.game = null; save(); App.go("home"); App.toast("Spiel abgebrochen");
      break;
    case "stp": {
      const rd = S.game.rounds[r], max = r + 1, f = el.dataset.f, d = Number(el.dataset.d);
      rd[f][i] = Math.max(0, Math.min(max, rd[f][i] + d));
      save(); App.refresh(); break;
    }
    case "tostiche": {
      const rd = S.game.rounds[S.game.cur];
      if (S.house && sum(rd.bids) === S.game.cur + 1) return App.toast("Hausregel: Summe der Ansagen darf nicht der Stichzahl entsprechen");
      S.game.phase = "won"; save(); App.go("round"); break;
    }
    case "backtobid": S.game.phase = "bid"; save(); App.go("round"); break;
    case "prevround":
      if (S.game.cur > 0) { S.game.cur--; S.game.phase = "summary"; save(); App.go("round"); }
      break;
    case "backfromfinal":
      S.game.finished = false; S.game.cur = S.game.rounds.length - 1; S.game.phase = "summary";
      save(); App.go("round"); break;
    case "evaluate": {
      const rd = S.game.rounds[S.game.cur];
      if (sum(rd.won) !== S.game.cur + 1) return App.toast("Stiche müssen der Kartenzahl entsprechen");
      rd.done = true; S.game.phase = "summary"; save(); App.go("round"); break;
    }
    case "backtowon": S.game.rounds[S.game.cur].done = false; S.game.phase = "won"; save(); App.go("round"); break;
    case "nextround": S.game.cur++; S.game.phase = "bid"; save(); App.go("round"); break;
    case "finish": S.game.finished = true; save(); App.go("final"); break;
    case "table":
      if (App.screen !== "edit") S.from = App.screen;
      App.go("table"); break;
    case "tableback": App.go(S.from); break;
    case "edit": S.edit = r; App.go("edit"); break;
  }
});

/* ---------- Start ---------- */
App.screens({ home: renderHome, rules: renderRules, round: renderRound, table: renderTable, edit: renderEdit, final: renderFinal }, { home: "home" });
save(); // einmal speichern, damit der Speicherstatus sofort stimmt
App.go("home");
</script>
</body>
</html>
