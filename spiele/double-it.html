<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Double It</title>
<script src="/common.js"></script>
<style>
  /* Nur spielspezifisches CSS – alles andere kommt aus common.js */
  .startbox{margin-bottom:var(--sp-14)}
  .startbox .btn + .btn{margin-top:var(--sp-10)}

  /* Startseite */
  .recrow{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-10);background:var(--card2);border:1px solid var(--line);
    border-radius:var(--r-btn);animation:app-pop var(--t-move) ease both}
  .recrow .num{font-size:24px;font-weight:900;line-height:1}
  .recrow .lbl{font-size:10px;letter-spacing:var(--ls-head);color:var(--muted);font-weight:700;text-transform:uppercase;margin-top:3px}
  .mini{min-width:42px;height:34px;padding:0 var(--sp-8);border-radius:var(--r-mini);display:grid;place-items:center;color:#fff;font-weight:900;font-size:var(--fs-text);
    text-shadow:0 1px 2px rgba(0,0,0,.35);flex:none}
  .mini.none{background:var(--card);border:1px solid var(--line);color:var(--muted)}
  .lastbig{text-align:center;padding:4px 0 0}
  .lastbig .num{font-size:44px;font-weight:900;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .lastbig .lbl{font-size:var(--fs-xs);letter-spacing:var(--ls-head);color:var(--muted);font-weight:700;text-transform:uppercase}

  /* Spiel */
  .stats{display:flex;gap:var(--sp-10);margin-bottom:var(--sp-12)}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-row);padding:var(--sp-8) var(--sp-6);text-align:center}
  .stat small{display:block;font-size:10px;letter-spacing:var(--ls-head);color:var(--muted);font-weight:700;text-transform:uppercase}
  .stat b{font-size:var(--fs-stat);font-weight:900;font-variant-numeric:tabular-nums}
  .chain{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin-bottom:var(--sp-12);min-height:26px}
  .cchip{min-width:30px;padding:3px 7px;border-radius:var(--r-pill);text-align:center;font-size:var(--fs-xs);font-weight:800;
    background:var(--card2);border:1px solid var(--line);color:var(--muted);transition:all .3s}
  .cchip.on{color:#fff;border-color:transparent;text-shadow:0 1px 2px rgba(0,0,0,.3)}

  .board{position:relative;width:min(100%,max(260px,calc(100vh - 360px)));aspect-ratio:1;margin:0 auto var(--sp-14);
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card);
    container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none}
  .cells{position:absolute;inset:var(--gap);display:grid;gap:var(--gap);
    grid-template-columns:repeat(var(--n),1fr);grid-template-rows:repeat(var(--n),1fr)}
  .cells i{background:var(--card2);border-radius:12%}
  .layer{position:absolute;inset:var(--gap)}
  .tile{position:absolute;left:0;top:0;z-index:2;
    width:calc((100% - var(--gap) * (var(--n) - 1)) / var(--n));aspect-ratio:1;
    transform:translate(calc(var(--c) * (100% + var(--gap))),calc(var(--r) * (100% + var(--gap))));
    transition:transform .12s ease-out}
  .tile.ghost{z-index:1}
  .tile .in{width:100%;height:100%;border-radius:14%;display:grid;place-items:center;color:#fff;font-weight:900;
    font-size:calc(100cqw / var(--n) * .42);text-shadow:0 2px 4px rgba(0,0,0,.35);
    box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 4px 10px rgba(0,0,0,.3)}
  .tile .in.d3{font-size:calc(100cqw / var(--n) * .34)}
  .tile .in.d4{font-size:calc(100cqw / var(--n) * .28)}
  .tile .in.d5{font-size:calc(100cqw / var(--n) * .23)}
  .tile .in.goal{box-shadow:0 0 22px rgba(var(--gold-rgb),.65),inset 0 0 0 2px rgba(255,255,255,.55)}
  .tile .in.new{animation:appear .2s .1s backwards}
  .tile .in.mer{animation:pop .22s .1s backwards}
  @keyframes appear{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.22)}100%{transform:scale(1)}}

  .overlay{position:absolute;inset:0;z-index:5;border-radius:var(--r-card);background:rgba(var(--bg-rgb),.84);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:var(--sp-10);padding:20px;text-align:center}
  .overlay.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:var(--fs-big);font-weight:900}
  .overlay p{margin:0 0 var(--sp-6);color:var(--text-soft);font-size:var(--fs-text);line-height:1.45}
  .overlay .btn{width:100%;max-width:260px}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Konfiguration ---------- */
const TARGET = 2048;
const N = 5;   // Feldgröße (fest 5 × 5)

/* ---------- Helfer ---------- */
const $ = id => document.getElementById(id);
const isPow2 = v => Number.isInteger(v) && v >= 2 && (v & (v-1)) === 0;
function colorOf(v){
  const k = Math.round(Math.log2(v));
  const h = (340 + (k-1) * 34) % 360;
  return `linear-gradient(135deg,hsl(${h} 85% 62%),hsl(${(h+22)%360} 80% 48%))`;
}

/* ---------- Speicher: nur lokal (localStorage) ---------- */
const St = App.store.create("doubleit_data", {
  defaults: { games:{}, best:{}, last:null },
  decode: d => ({ games:d.games || {}, best:d.best || {}, last:d.last || null }),
  /* Speicher voll: älteste Zugschritte entfernen und noch einmal versuchen */
  onFull: () => {
    for(const k in D.games){
      const g = D.games[k];
      if(g && Array.isArray(g.hist) && g.hist.length > 200) g.hist = g.hist.slice(Math.floor(g.hist.length / 2));
    }
    return true;
  }
});
let D = St.load();
const save = () => St.save(D);

/* ---------- Spiellogik ---------- */
let G = null;
let overlay = null;
const fx = new Map();

function makeGame(){
  const g = { n:N, tiles:[], nextId:1, score:0, moves:0, hist:[], won:false, over:false, rec:false };
  spawn(g); spawn(g);
  return g;
}
function validGame(g){
  if(!g || g.n !== N || !Array.isArray(g.tiles) || !Array.isArray(g.hist)) return false;
  const seen = new Set();
  for(const t of g.tiles){
    if(!t || !isPow2(t.v) || !(t.r >= 0 && t.r < N) || !(t.c >= 0 && t.c < N)) return false;
    const k = t.r * N + t.c;
    if(seen.has(k)) return false;
    seen.add(k);
  }
  return true;
}
function hasMoves(tiles, n){
  if(tiles.length < n*n) return true;
  const grid = Array.from({length:n}, () => Array(n).fill(0));
  tiles.forEach(t => grid[t.r][t.c] = t.v);
  for(let r=0;r<n;r++) for(let c=0;c<n;c++){
    if(c+1<n && grid[r][c] === grid[r][c+1]) return true;
    if(r+1<n && grid[r][c] === grid[r+1][c]) return true;
  }
  return false;
}
const highest = g => Math.max(0, ...g.tiles.map(t => t.v));

/* Fairer Spawn: bevorzugt Positionen/Werte, nach denen noch ein Zug möglich ist */
function spawn(g){
  const n = g.n;
  const occ = new Set(g.tiles.map(t => t.r*n + t.c));
  const empty = [];
  for(let i=0;i<n*n;i++) if(!occ.has(i)) empty.push(i);
  if(!empty.length) return;
  App.shuffleInPlace(empty);
  const first = Math.random() < 0.9 ? 2 : 4;
  const vals = [first, first === 2 ? 4 : 2];
  let chosen = null;
  outer:
  for(const v of vals){
    for(const cell of empty){
      const t = { id:g.nextId, v, r:Math.floor(cell/n), c:cell%n };
      g.tiles.push(t);
      if(hasMoves(g.tiles, n)){ chosen = t; break outer; }
      g.tiles.pop();
    }
  }
  if(!chosen){
    const cell = empty[0];
    chosen = { id:g.nextId, v:first, r:Math.floor(cell/n), c:cell%n };
    g.tiles.push(chosen);
  }
  g.nextId++;
  fx.set(chosen.id, "new");
}

/* Zugverlauf: kompakt gespeichert, damit er unbegrenzt wachsen kann */
function snapshot(){
  const txt = G.tiles.map(t =>
    t.id.toString(36) + "," + Math.round(Math.log2(t.v)).toString(36) + "," + (t.r * G.n + t.c).toString(36)
  ).join(";");
  return [txt, G.score, G.moves];
}
function decodeSnap(s, n){
  if(Array.isArray(s)){
    const tiles = s[0] ? s[0].split(";").map(p => {
      const a = p.split(",");
      const pos = parseInt(a[2], 36);
      return { id:parseInt(a[0], 36), v:Math.pow(2, parseInt(a[1], 36)), r:Math.floor(pos / n), c:pos % n };
    }) : [];
    return { tiles, s:s[1], m:s[2] };
  }
  /* altes Format (frühere Versionen) */
  return { tiles:s.t.map(a => ({ id:a[0], v:a[1], r:a[2], c:a[3] })), s:s.s, m:s.m };
}

function recordResult(g){
  if(g.rec || g.moves === 0) return;
  g.rec = true;
  D.last = { s:g.score, b:highest(g), m:g.moves, n:g.n, t:Date.now() };
}

function move(dir){
  if(App.screen !== "play" || !G || G.over || overlay) return;
  const n = G.n;
  const snap = snapshot();
  const grid = Array.from({length:n}, () => Array(n).fill(null));
  G.tiles.forEach(t => grid[t.r][t.c] = t);
  let moved = false, gained = 0;
  const ghosts = [], removed = new Set();

  for(let k=0;k<n;k++){
    const line = [];
    for(let j=0;j<n;j++){
      let r, c;
      if(dir === "left"){ r=k; c=j; }
      else if(dir === "right"){ r=k; c=n-1-j; }
      else if(dir === "up"){ r=j; c=k; }
      else { r=n-1-j; c=k; }
      line.push([r,c]);
    }
    const list = line.map(([r,c]) => grid[r][c]).filter(Boolean);
    let i = 0, p = 0;
    while(i < list.length){
      const t = list[i];
      const [r,c] = line[p];
      if(i+1 < list.length && list[i+1].v === t.v){
        const o = list[i+1];
        o.r = r; o.c = c; t.r = r; t.c = c;
        t.v *= 2; gained += t.v;
        ghosts.push(o); removed.add(o.id);
        fx.set(t.id, "mer");
        moved = true;
        i += 2;
      }else{
        if(t.r !== r || t.c !== c){ t.r = r; t.c = c; moved = true; }
        i++;
      }
      p++;
    }
  }
  if(!moved) return;

  G.tiles = G.tiles.filter(t => !removed.has(t.id));
  G.hist.push(snap);
  G.score += gained;
  G.moves++;
  G.rec = false;
  spawn(G);

  const hi = highest(G);
  const b = D.best[n] || { s:0, b:0 };
  if(G.score > b.s) b.s = G.score;
  if(hi > b.b) b.b = hi;
  D.best[n] = b;

  if(!hasMoves(G.tiles, n)){
    G.over = true; overlay = "over";
    recordResult(G);
  }else if(hi >= TARGET && !G.won){
    G.won = true; overlay = "win";
  }
  save();
  renderTiles(ghosts);
}

function undo(){
  if(!G.hist.length){ App.toast("Kein Zug zum Zurücknehmen"); return; }
  const s = decodeSnap(G.hist.pop(), G.n);
  G.tiles = s.tiles;
  G.score = s.s; G.moves = s.m;
  G.over = false; G.rec = false; overlay = null;
  fx.clear();
  save();
  renderTiles();
}

function startGame(fresh){
  let g = D.games[N];
  if(fresh || !validGame(g)){
    if(g && validGame(g)) recordResult(g);
    g = makeGame();
    D.games[N] = g;
  }
  G = g;
  overlay = G.over ? "over" : null;
  fx.clear();
  save();
  App.go("play");
}

/* ---------- Screens ---------- */
function miniTile(v){
  return v ? `<div class="mini" style="background:${colorOf(v)}">${v}</div>` : `<div class="mini none">–</div>`;
}

function renderHome(){
  const g = D.games[N];
  const running = validGame(g) && g.moves > 0 && !g.over;
  const b = D.best[N];

  const rec = `<div class="recrow">
      <div class="grow"><div class="num">${b ? b.s : 0}</div><div class="lbl">Punkte</div></div>
      <div class="lbl" style="margin:0">Höchster Block</div>
      ${miniTile(b ? b.b : 0)}
    </div>`;

  let last;
  if(D.last){
    const L = D.last;
    const pr = L.s > 0 && D.best[L.n] && L.s >= D.best[L.n].s;
    const when = App.fmt.date(L.t) + ", " + new Date(L.t).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
    last = `<div class="lastbig"><div class="num">${L.s}</div><div class="lbl">Punkte</div></div>
      <div class="chips">
        ${pr ? App.ui.chip("🏆 Rekord", "gold") : ""}
        ${App.ui.chip("Block " + L.b)}
        ${App.ui.chip(L.m + " Züge")}
        ${App.ui.chip(when)}
      </div>`;
  }else{
    last = App.ui.empty("Noch kein Spiel beendet.");
  }

  const startHtml = running
    ? App.ui.btn("▶ Weiterspielen", { big:true, block:true, action:"cont", sub:"(" + g.score + " Punkte)" }) +
      App.ui.btn("Neues Spiel", { kind:"ghost", block:true, action:"newgame", confirm:true })
    : App.ui.btn("▶ Spiel starten", { big:true, block:true, action:"start" });

  App.render(
    App.ui.topbar([], { info:true }) +
    App.ui.header("DOUBLE IT", "2 · 4 · 8 · 16 · 32 … – wische und verdopple") +
    `<div class="startbox">${startHtml}</div>` +
    App.ui.card("🏆 Rekord", rec) +
    App.ui.card("Letztes Ergebnis", last) +
    App.ui.storageCard([
      { kind:"resetRecord", run:() => { D.best = {}; D.last = null; save(); } },
      { kind:"clearAll",    run:() => { D = { games:{}, best:{}, last:null }; G = null; save(); } }
    ])
  );
}

function renderRules(){
  App.render(App.ui.rules({
    sub: "So funktioniert Double It",
    sections: [
      { h:"🎯 Ziel", p:"Baue den Block mit der **2048**. Danach kannst du weiterspielen und noch höhere Zahlen knacken. Ein neuer Rekord geht immer." },
      { h:"👆 Wischen", p:"Wische in eine Richtung (am PC: Pfeiltasten oder WASD). Alle Blöcke rutschen bis zum Rand." },
      { h:"✖️ Verdoppeln", p:"Treffen zwei gleiche Blöcke aufeinander, werden sie zu einem Block mit dem **doppelten Wert**:",
        ul:["2 + 2 → **4**", "4 + 4 → **8**", "8 + 8 → **16**", "16 + 16 → **32** … und so weiter"] },
      { h:"✨ Neue Blöcke", p:"Nach jedem Zug erscheint ein neuer Block mit einer 2 (meistens) oder einer 4." },
      { h:"🏆 Punkte", p:"Bei jedem Verschmelzen bekommst du den Wert des neuen Blocks als Punkte." },
      { h:"🛟 Immer machbar", ul:[
        "Neue Blöcke werden so gesetzt, dass nach Möglichkeit noch ein Zug übrig bleibt.",
        "Mit **„Zug zurück“** gehst du jederzeit Schritt für Schritt zurück, beliebig oft (Taste Z)."
      ] },
      { h:"💡 Tipps", ul:[
        "Halte den größten Block in einer Ecke.",
        "Wische möglichst nur in zwei bis drei Richtungen.",
        "Spielstand, Rekord und letztes Ergebnis werden automatisch gespeichert."
      ] }
    ]
  }));
}

const els = new Map();

function renderPlay(){
  const n = G.n;
  App.render(
    App.ui.topbar([], { menu:true, info:true }) +
    App.ui.header("DOUBLE IT", "", "md") +
    `<div class="stats">
      <div class="stat"><small>Punkte</small><b id="sScore">0</b></div>
      <div class="stat"><small>Rekord</small><b id="sBest">0</b></div>
      <div class="stat"><small>Züge</small><b id="sMoves">0</b></div>
    </div>
    <div class="chain" id="chain"></div>
    <div class="board" id="board">
      <div class="cells" id="cells"></div>
      <div class="layer" id="layer"></div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="row">
      <button class="btn grow" id="undoBtn" data-a="undo">↶ Zug zurück</button>
      <button class="btn ghost grow" id="newBtn" data-a="newgame">Neues Spiel</button>
    </div>
    <div class="hint" id="hint"></div>`
  );
  const b = $("board");
  b.style.setProperty("--n", n);
  b.style.setProperty("--gap", "8px");
  $("cells").innerHTML = "<i></i>".repeat(n*n);
  els.clear();
  bindSwipe(b);
  renderTiles();
}

function renderTiles(ghosts = []){
  const keep = new Set(G.tiles.map(t => t.id));
  ghosts.forEach(t => keep.add(t.id));

  const place = (t, isGhost) => {
    let el = els.get(t.id);
    if(!el){
      el = document.createElement("div");
      el.innerHTML = '<div class="in"></div>';
      $("layer").appendChild(el);
      els.set(t.id, el);
    }
    el.className = "tile" + (isGhost ? " ghost" : "");
    el.style.setProperty("--r", t.r);
    el.style.setProperty("--c", t.c);
    const inn = el.firstChild;
    inn.textContent = t.v;
    inn.style.background = colorOf(t.v);
    const len = String(t.v).length;
    const base = "in" + (len >= 5 ? " d5" : len === 4 ? " d4" : len === 3 ? " d3" : "") + (t.v >= TARGET ? " goal" : "");
    inn.className = base;
    const f = fx.get(t.id);
    if(f && !isGhost){ void inn.offsetWidth; inn.className = base + " " + f; }
    fx.delete(t.id);
  };

  G.tiles.forEach(t => place(t, false));
  ghosts.forEach(t => place(t, true));

  for(const [id, el] of els){
    if(!keep.has(id)){ el.remove(); els.delete(id); }
  }
  ghosts.forEach(t => {
    setTimeout(() => {
      if(App.screen !== "play" || !G || G.tiles.some(x => x.id === t.id)) return;
      const el = els.get(t.id);
      if(el){ el.remove(); els.delete(t.id); }
    }, 150);
  });
  updateUI();
}

function updateUI(){
  const b = D.best[G.n] || { s:0, b:0 };
  $("sScore").textContent = G.score;
  $("sBest").textContent = b.s;
  $("sMoves").textContent = G.moves;
  $("undoBtn").textContent = "↶ Zug zurück" + (G.hist.length ? " (" + G.hist.length + ")" : "");
  $("undoBtn").disabled = G.hist.length === 0;
  $("newBtn").toggleAttribute("data-confirm", G.moves > 0 && !G.over);

  const hi = highest(G);
  let chips = "";
  for(let v=2; v <= Math.max(TARGET, hi); v *= 2){
    const on = hi >= v;
    chips += `<span class="cchip ${on ? "on" : ""}" style="${on ? "background:" + colorOf(v) : ""}">${v}</span>`;
  }
  $("chain").innerHTML = chips;

  const ov = $("overlay");
  if(overlay === "over"){
    ov.innerHTML = `<div class="big">Kein Zug mehr</div>
      <p>${G.score} Punkte · höchster Block ${hi}. Geh einen Schritt zurück oder starte neu.</p>
      <button class="btn ok" data-a="undo">↶ Zug zurück</button>
      <button class="btn ghost" data-a="newnow">Neues Spiel</button>`;
    ov.classList.add("show");
  }else if(overlay === "win"){
    ov.innerHTML = `<div class="big">🎉 ${TARGET} geschafft!</div>
      <p>Stark! Spiel weiter und knacke noch höhere Zahlen.</p>
      <button class="btn ok" data-a="dismiss">Weiterspielen</button>
      <button class="btn ghost" data-a="newnow">Neues Spiel</button>`;
    ov.classList.add("show");
  }else{
    ov.classList.remove("show");
    ov.innerHTML = "";
  }
  const h = $("hint");
  h.textContent = App.store.status();
  h.className = "hint" + (App.store.ok ? "" : " warn");
}

/* ---------- Events ---------- */
App.on((a) => {
  switch(a){
    case "start":
    case "cont": startGame(false); break;
    case "newgame": startGame(true); App.toast("Neues Spiel gestartet"); break;
    case "newnow": startGame(true); break;
    case "undo": undo(); break;
    case "dismiss": overlay = null; updateUI(); break;
  }
});

/* Tastatur */
document.addEventListener("keydown", e => {
  if(App.screen !== "play") return;
  const map = { ArrowLeft:"left", ArrowRight:"right", ArrowUp:"up", ArrowDown:"down",
                a:"left", d:"right", w:"up", s:"down", A:"left", D:"right", W:"up", S:"down" };
  if(map[e.key]){ e.preventDefault(); move(map[e.key]); return; }
  if(e.key === "z" || e.key === "Z" || e.key === "u" || e.key === "Backspace"){
    e.preventDefault(); undo();
  }
});

/* Wischen (Touch & Maus) */
let sx = 0, sy = 0, sid = null;
function bindSwipe(board){
  board.addEventListener("pointerdown", e => {
    if(e.target.closest(".overlay.show")) return;
    sx = e.clientX; sy = e.clientY; sid = e.pointerId;
  });
  board.addEventListener("pointerup", e => {
    if(sid === null || e.pointerId !== sid) return;
    sid = null;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    if(Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  });
  board.addEventListener("pointercancel", () => { sid = null; });
  board.addEventListener("touchmove", e => e.preventDefault(), { passive:false });
}

/* ---------- Start ---------- */
App.screens({ home: renderHome, rules: renderRules, play: renderPlay });
save();
App.go("home");
</script>
