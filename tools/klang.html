<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Klang-Tools</title>
<script src="/common.js"></script>
<style>
  /* Nur das, was common.js nicht liefert: quadratische Kacheln */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-12);margin-top:var(--sp-6)}
  a.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-8);
    aspect-ratio:1/1;min-width:0;padding:var(--sp-12) var(--sp-10);text-align:center;overflow:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-btn-big);
    box-shadow:var(--shadow-card);animation:app-pop var(--t-enter) ease both;
    transition:transform var(--t-press),border-color var(--t-fade)}
  a.tile:active{transform:scale(.97);border-color:var(--a2)}
  .tile .item-icon{width:60px;height:60px;font-size:32px;line-height:1;border-radius:var(--r-btn)}
  .tile .title{font-weight:800;font-size:var(--fs-btn)}
  .tile .text{color:var(--muted);font-size:var(--fs-hint);line-height:var(--lh-small)}
  @media (max-width:360px){
    a.tile{gap:var(--sp-6);padding:var(--sp-10) var(--sp-8)}
    .tile .item-icon{width:48px;height:48px;font-size:26px;border-radius:var(--r-small)}
    .tile .title{font-size:var(--fs-base)}
    .tile .text{font-size:var(--fs-xs)}
  }
  @media (prefers-reduced-motion:reduce){a.tile{animation:none;transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   NEUE WERKZEUGE HIER ERGÄNZEN
   ============================================================ */
const TOOLS = [
  { titel: "Metronom",      text: "Gleichmäßiger Takt, 20–300 BPM",     icon: "🥁", url: "klang/metronom.html" },
  { titel: "Tongenerator",  text: "Sinus, Rechteck, Sägezahn, Dreieck", icon: "🎶", url: "klang/tongenerator.html" },
  { titel: "Stimmgerät",    text: "Töne per Mikrofon erkennen",         icon: "🎸", url: "klang/stimmgeraet.html" },
  { titel: "Dezibelmesser", text: "Lautstärke messen und aufzeichnen",  icon: "🔊", url: "klang/dezibelmesser.html" }
];

const MIC_HINT = "🎤 Stimmgerät und Dezibelmesser brauchen Zugriff auf das Mikrofon. Es wird nichts aufgenommen oder gespeichert.";

const { ui, esc } = App;

function tile(t, i){
  return `<a class="tile" href="${esc(t.url)}" style="animation-delay:${i * 60}ms">
    <div class="item-icon">${esc(t.icon)}</div>
    <div class="title">${esc(t.titel)}</div>
    <div class="text">${esc(t.text)}</div>
  </a>`;
}

function renderHome(){
  App.render(
    ui.topbar() +
    ui.header("KLANG", "Vier Werkzeuge rund um Musik und Schall", "md") +
    `<div class="grid">${TOOLS.map(tile).join("")}</div>` +
    ui.hint(MIC_HINT)
  );
}

App.screens({ home: renderHome });
App.go("home");
</script>
</body>
</html>
