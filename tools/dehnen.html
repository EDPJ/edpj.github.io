<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dehnen</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1c2230; --line:#262d3d;
    --text:#f2f4f8; --muted:#8c95a8;
    --a1:#ff3b6b; --a2:#7c5cff; --ok:#2ee59d; --warn:#ffb020;
    --grad:linear-gradient(135deg,var(--a1),var(--a2));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;
    background:
      radial-gradient(600px 300px at 10% -5%,rgba(255,59,107,.18),transparent 60%),
      radial-gradient(600px 300px at 100% 0%,rgba(124,92,255,.2),transparent 60%),
      var(--bg);
    background-attachment:fixed;touch-action:manipulation;overscroll-behavior-y:contain}
  #app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 120px);}
  header{text-align:center;margin-bottom:14px}
  .logo{font-size:34px;font-weight:900;letter-spacing:4px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .card h2{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700}
  .row{display:flex;align-items:center;gap:10px}
  .grow{flex:1;min-width:0}
  button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  a{color:inherit;text-decoration:none}
  .btn{display:inline-block;text-align:center;background:var(--grad);color:#fff;font-weight:700;border-radius:14px;padding:14px 18px;font-size:16px;
    transition:transform .1s,opacity .2s}
  .btn:active{transform:scale(.97)}
  .btn.block{width:100%}
  .btn.ghost{background:var(--card2);border:1px solid var(--line);color:var(--text)}
  .btn.ok{background:linear-gradient(135deg,#1fcf8a,#16a0c9)}
  .btn:disabled{opacity:.4}
  .btn.pulse{animation:pulse 1.2s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(46,229,157,.55)}100%{box-shadow:0 0 0 14px rgba(46,229,157,0)}}
  .player{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card2);border:1px solid var(--line);
    border-radius:14px;margin-top:8px;cursor:pointer;text-align:left;width:100%;animation:pop .25s ease}
  .player:active{transform:scale(.98)}
  .player.cur{border-color:var(--a2)}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .avatar{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;
    font-weight:800;flex:none}
  .avatar.done{background:linear-gradient(135deg,#1fcf8a,#16a0c9)}
  .pname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .parea{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pts{font-weight:800;min-width:44px;text-align:right;font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
  .bottom{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background:linear-gradient(to top,var(--bg) 60%,transparent);z-index:10}
  .bottom .inner{max-width:480px;margin:0 auto;display:flex;gap:10px}
  .bottom .inner .ghost{flex:1}
  .bottom .inner .ok{flex:2}
  .hint{color:var(--muted);font-size:12px;text-align:center;margin-top:10px}
  .empty{color:var(--muted);text-align:center;font-size:14px;padding:10px 0 2px}
  .warnbox{background:rgba(255,176,32,.1);border:1px solid var(--warn);color:var(--warn);
    border-radius:14px;padding:10px 12px;font-size:13px;margin-bottom:14px;line-height:1.4}
  .okbox{background:rgba(46,229,157,.1);border:1px solid var(--ok);color:var(--ok);
    border-radius:14px;padding:12px;font-size:14px;margin-bottom:14px;line-height:1.4;text-align:center;font-weight:600}
  .muted{color:var(--muted)}
  .big{font-size:26px;font-weight:800}
  .back{display:flex;align-items:center;gap:8px;background:none;color:var(--muted);font-size:15px;padding:6px 0;margin-bottom:10px}
  /* Zurück-zur-Übersicht-Button während der Übungen */
  .topnav{margin-bottom:14px}
  .navbtn{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;font-size:15px;border-radius:12px}
  .progress{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
  .progress i{width:22px;height:5px;border-radius:9px;background:var(--line);transition:background .2s}
  .progress i.d{background:var(--ok)}
  .progress i.c{background:var(--grad)}
  .head{text-align:center;margin-bottom:14px}
  .bar{height:8px;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .bar>div{height:100%;width:100%;background:var(--ok);transform-origin:left center;transform:scaleX(0);will-change:transform;transition:transform .5s ease}
  .figure{padding:10px 10px 0;text-align:center}
  .figure svg{width:100%;height:auto;max-height:32vh;display:block}
  .timer{text-align:center}
  .phase{font-size:14px;color:var(--muted);font-weight:600;min-height:1.3em}
  .time{font-size:68px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1;margin:2px 0 10px}
  .time.prep{color:var(--warn)}
  .time.switch{color:var(--a1)}
  .tbar{height:10px;background:var(--card2);border:1px solid var(--line);border-radius:99px;overflow:hidden}
  .tbar>div{height:100%;width:100%;background:var(--grad);transform-origin:left center;transform:scaleX(0);will-change:transform}
  .tbar.prep>div{background:var(--warn)}
  .timer .btn{margin-top:14px}
  .rules h3{margin:0 0 6px;font-size:16px}
  .rules p,.rules li{color:#c9d0de;font-size:14px;line-height:1.55;margin:0 0 6px}
  .rules ul{padding-left:20px;margin:0 0 6px}
  .rules .sec{margin-top:16px}
  svg .limb{fill:none;stroke:#f2f4f8;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  svg .backl{fill:none;stroke:#6b7490;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
  svg .headc{fill:#f2f4f8}
  svg .hl{fill:rgba(255,59,107,.45)}
  svg .floor{stroke:#3a4256;stroke-width:4;stroke-linecap:round}
  svg .wall{stroke:#3a4256;stroke-width:10;stroke-linecap:round}
  svg text{font-size:12px;fill:#8c95a8;font-family:system-ui,sans-serif}
  @media (max-width:360px){.time{font-size:54px}.big{font-size:22px}}
  @media (orientation:landscape) and (max-height:500px){.figure svg{max-height:50vh}}
  @media (prefers-reduced-motion:reduce){.bar>div{transition:none}}
</style>
<!-- Toasts aus extra Datei (muss im selben Ordner liegen) -->
<script src="/toast.js"></script>
<!-- Übungen aus extra Datei (muss im selben Ordner liegen) -->
<script src="dehnen-uebungen.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Übungen laden (aus dehnen-uebungen.js) ---------- */
const EX_OK = (typeof EX !== "undefined") && Array.isArray(EX) && EX.length > 0;
const LIST = EX_OK ? EX : [];
const CFG = (typeof EINSTELLUNGEN !== "undefined" && EINSTELLUNGEN) ? EINSTELLUNGEN : {};
const PREP_SEC = Number(CFG.prepSec) || 5;
const SWITCH_SEC = Number(CFG.switchSec) || 5;
const N = LIST.length;

/* ---------- Helfer ---------- */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
function figureSVG(p){
  let s = '<svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg" role="img">';
  if(p.wall) s += '<line class="wall" x1="274" y1="15" x2="274" y2="180"/>';
  if(!p.nofloor) s += '<line class="floor" x1="12" y1="184" x2="308" y2="184"/>';
  (p.hl||[]).forEach(h => s += `<circle class="hl" cx="${h[0]}" cy="${h[1]}" r="18"/>`);
  (p.back||[]).forEach(d => s += `<path class="backl" d="${d}"/>`);
  p.paths.forEach(d => s += `<path class="limb" d="${d}"/>`);
  s += `<circle class="headc" cx="${p.head[0]}" cy="${p.head[1]}" r="13"/>`;
  if(p.note) s += `<text x="10" y="18">${esc(p.note)}</text>`;
  return s + '</svg>';
}

/* ---------- Speicher: lokal, Tag wechselt um 3:00 Uhr ---------- */
const KEY = "dehnen_data";
let storageOk = true;
function logicalDay(){
  const d = new Date(Date.now() - 3*3600*1000);
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}
const S = { day:logicalDay(), done:[], current:0, screen:"home" };
function save(){
  try{
    localStorage.setItem(KEY, JSON.stringify({d:S.day, done:S.done, c:S.current}));
    storageOk = true;
  }catch(e){ storageOk = false; }
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }catch(e){}
  if(!raw) return;
  try{
    const d = JSON.parse(raw);
    if(d.d !== logicalDay()) return;
    S.done = (Array.isArray(d.done) ? d.done : []).map(Number).filter(i => i>=0 && i<N);
    S.current = (Number(d.c) >= 0 && Number(d.c) < N) ? Number(d.c) : 0;
  }catch(e){}
}
load();

function ensureDay(){
  if(S.day !== logicalDay()){
    S.day = logicalDay(); S.done = []; S.current = 0; S.screen = "home";
    setupTimer(false); save(); render();
  }
}
setInterval(ensureDay, 15000);
document.addEventListener("visibilitychange", () => {
  if(!document.hidden){
    ensureDay();
    if(S.screen === "play") requestWake();
    if(T.running) tick();
  }
});

/* ---------- Bildschirm wach halten (solange eine Übung geöffnet ist) ---------- */
let wakeLock = null, wakePending = false;
async function requestWake(){
  if(!("wakeLock" in navigator) || wakeLock || wakePending || document.hidden) return;
  wakePending = true;
  try{
    const lock = await navigator.wakeLock.request("screen");
    wakeLock = lock;
    lock.addEventListener("release", () => {
      if(wakeLock !== lock) return;          /* absichtlich freigegeben */
      wakeLock = null;                       /* vom System freigegeben -> neu anfordern */
      if(S.screen === "play") requestWake();
    });
  }catch(e){}
  wakePending = false;
}
function releaseWake(){
  try{ if(wakeLock){ const l = wakeLock; wakeLock = null; l.release(); } }catch(e){}
}

/* ---------- Timer (performance.now + requestAnimationFrame = flüssiger Balken) ---------- */
const T = { phases:[], total:0, i:0, phaseRem:0, running:false, started:false, finished:false,
            startTs:0, lastSec:null, raf:null, iv:null };
let barEl = null, timeEl = null, phaseEl = null, lastTimeTxt = "", lastPhaseTxt = "";

function stopLoops(){
  clearInterval(T.iv); T.iv = null;
  if(T.raf){ cancelAnimationFrame(T.raf); T.raf = null; }
}
function setupTimer(autostart){
  stopLoops();
  T.running = false; T.started = false; T.finished = false; T.lastSec = null;
  const ex = LIST[S.current];
  if(!ex){ T.phases = []; T.i = 0; T.phaseRem = 0; return; }
  T.phases = [{l:"Gleich geht’s los – Position einnehmen", t:PREP_SEC, type:"prep"}];
  if(ex.sides){
    T.phases.push({l:"Seite 1", t:ex.sec, type:"hold", side:1});
    T.phases.push({l:"Seite wechseln …", t:SWITCH_SEC, type:"switch"});
    T.phases.push({l:"Seite 2", t:ex.sec, type:"hold", side:2});
  }else{
    T.phases.push({l:"Halten & ruhig atmen", t:ex.sec, type:"hold"});
  }
  T.total = T.phases.reduce((a,p) => a + p.t, 0);
  T.i = 0; T.phaseRem = T.phases[0].t;
  if(autostart) runTimer();
}
function runTimer(){
  T.running = true; T.started = true; T.lastSec = null;
  T.startTs = performance.now();
  stopLoops();
  T.iv = setInterval(tick, 250);
  const frame = () => { tick(); if(T.running) T.raf = requestAnimationFrame(frame); };
  T.raf = requestAnimationFrame(frame);
}
function tick(){
  if(!T.running) return;
  const el = (performance.now() - T.startTs) / 1000;
  if(el >= T.total){
    T.finished = true; T.running = false; T.i = T.phases.length - 1; T.phaseRem = 0;
    stopLoops();
    updateTimerUI(); return;
  }
  let acc = 0, idx = 0;
  while(idx < T.phases.length - 1 && el >= acc + T.phases[idx].t){ acc += T.phases[idx].t; idx++; }
  let changed = false;
  if(idx !== T.i){ T.i = idx; T.lastSec = null; changed = true; }
  const ph = T.phases[idx], inPhase = el - acc;
  T.phaseRem = ph.t - inPhase;
  const secs = Math.ceil(T.phaseRem);
  if(secs !== T.lastSec){ T.lastSec = secs; changed = true; }
  if(changed) updateTimerUI();
  if(barEl) barEl.style.transform = "scaleX(" + Math.min(1, inPhase / ph.t).toFixed(4) + ")";
}
function updateTimerUI(){
  if(!timeEl || S.screen !== "play" || !T.phases.length) return;
  const ph = T.phases[T.i];
  const secs = Math.ceil(Math.max(0, T.phaseRem));
  const txt = `${Math.floor(secs/60)}:${pad(secs%60)}`;
  if(txt !== lastTimeTxt){ timeEl.textContent = txt; lastTimeTxt = txt; }
  const prep = ph.type === "prep" && !T.finished;
  timeEl.classList.toggle("prep", prep);
  timeEl.classList.toggle("switch", ph.type === "switch" && !T.finished);
  document.getElementById("tbarWrap").classList.toggle("prep", prep);
  let label;
  if(T.finished) label = "✅ Zeit abgelaufen – gut gemacht!";
  else if(!T.started) label = "Bereit";
  else label = ph.l + (ph.type === "hold" && ph.side ? ` (${ph.side}/2)` : "");
  if(label !== lastPhaseTxt){ phaseEl.textContent = label; lastPhaseTxt = label; }
  if(T.finished) barEl.style.transform = "scaleX(1)";
  else if(!T.started) barEl.style.transform = "scaleX(0)";
  const nb = document.getElementById("nextBtn");
  if(nb) nb.classList.toggle("pulse", T.finished);
}

/* ---------- Navigation ---------- */
function openExercise(i, autostart){
  if(!N) return;
  S.current = Math.max(0, Math.min(N-1, i));
  S.screen = "play";
  save(); setupTimer(autostart); render();
  window.scrollTo(0, 0);
}
function toMenu(){
  setupTimer(false);
  S.screen = "home"; render(); window.scrollTo(0, 0);
}
/* Beendet der nächste Klick das gesamte Programm? */
function isFinishing(){
  if(!S.done.includes(S.current)) return S.done.length === N - 1;
  return S.done.length >= N && S.current === N - 1;
}
function nextExercise(){
  if(isFinishing()){
    const firstTime = !S.done.includes(S.current);
    if(firstTime) S.done.push(S.current);
    save(); toMenu();
    if(firstTime) toast("🎉 Alle Übungen geschafft!", "success");
    return;
  }
  if(!S.done.includes(S.current)) S.done.push(S.current);
  let next = -1;
  if(S.done.length >= N){
    next = S.current + 1;                   /* Wiederholungsrunde: einfach der Reihe nach */
  }else{
    for(let k = 1; k <= N; k++){ const j = (S.current + k) % N; if(!S.done.includes(j)){ next = j; break; } }
  }
  openExercise(next < 0 ? 0 : next, true);
}
function startButtonAction(){
  if(!N) return;
  if(S.done.length >= N) return openExercise(0, true);
  let i = S.done.includes(S.current) ? LIST.findIndex((_, k) => !S.done.includes(k)) : S.current;
  openExercise(i < 0 ? 0 : i, true);
}

/* ---------- Render ---------- */
function render(){
  if(S.screen === "rules"){ releaseWake(); return renderRules(); }
  if(S.screen === "play" && N){ requestWake(); return renderPlay(); }
  S.screen = "home";
  releaseWake();
  renderHome();
}

function renderHome(){
  timeEl = barEl = phaseEl = null;
  const dt = new Date().toLocaleDateString("de-DE", {weekday:"long", day:"numeric", month:"long"});
  const rows = N ? LIST.map((e, i) => `
    <button class="player ${i === S.current && !S.done.includes(i) ? "cur" : ""}" data-a="open" data-i="${i}">
      <div class="avatar ${S.done.includes(i) ? "done" : ""}">${S.done.includes(i) ? "✓" : i + 1}</div>
      <div class="grow"><div class="pname">${esc(e.name)}</div><div class="parea">${esc(e.area)}</div></div>
      <div class="pts">${e.sides ? "2×" + e.sec : e.sec} s</div>
    </button>`).join("") : `<div class="empty">Keine Übungen geladen.</div>`;
  const storageText = storageOk
    ? "💾 Wird nur lokal auf diesem Gerät gespeichert"
    : "⚠️ Speichern nicht möglich (nur bis zum Neuladen)";
  const allDone = N > 0 && S.done.length >= N;
  const label = allDone ? "Noch einmal durchgehen" : (S.done.length > 0 ? "Weitermachen" : "Beginnen");

  $app.innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <a class="btn ghost grow" href="/index.html">⬅️ Home</a>
      <button class="btn ghost grow" data-a="rules">📖 Ablauf</button>
    </div>
    <header>
      <div class="logo">DEHNEN</div>
      <div class="sub">Rücken &amp; Beine · ${esc(dt)}</div>
    </header>
    ${EX_OK ? "" : `<div class="warnbox">⚠️ Die Datei <b>dehnen-uebungen.js</b> wurde nicht gefunden oder ist leer. Lege sie in denselben Ordner wie diese Seite.</div>`}
    ${allDone ? `<div class="okbox">🎉 Geschafft! Morgen ab 3:00 Uhr geht es von vorn los.</div>` : ""}
    <div class="card">
      <h2>Heute (${S.done.length} von ${N})</h2>
      <div class="bar"><div id="homeBar" style="transform:scaleX(${N ? S.done.length / N : 0})"></div></div>
      ${rows}
    </div>
    <div class="card">
      <h2>Speicher</h2>
      <button class="btn ghost block" data-a="reset">Heutigen Fortschritt zurücksetzen</button>
      <div class="hint">${storageText}</div>
    </div>
    <div class="bottom"><div class="inner">
      <button class="btn block" data-a="start" ${N ? "" : "disabled"}>▶ ${label}</button>
    </div></div>`;
}

function renderRules(){
  timeEl = barEl = phaseEl = null;
  $app.innerHTML = `
    <button class="back" data-a="menu">← Zurück</button>
    <header>
      <div class="logo" style="font-size:28px">ABLAUF</div>
      <div class="sub">So funktioniert das Dehnprogramm</div>
    </header>
    <div class="card rules">
      <h3>🎯 Idee</h3>
      <p>Jeden Tag ${N} Übungen für Rücken und Beine – eine nach der anderen, geführt vom Timer.</p>
      <div class="sec"></div>
      <h3>⏱️ Timer</h3>
      <ul>
        <li>Mit „Beginnen“ startet die erste Übung.</li>
        <li>Vor jeder Übung gibt es ${PREP_SEC} Sekunden Vorbereitung, dann läuft die Haltezeit.</li>
        <li>Bei Übungen mit zwei Seiten gibt es dazwischen ${SWITCH_SEC} Sekunden zum Wechseln.</li>
        <li>Der Timer lässt sich nicht pausieren, aber jederzeit zurücksetzen. Dann beginnt er wieder mit ${PREP_SEC} Sekunden Vorbereitung.</li>
        <li>Während einer Übung bleibt das Display an.</li>
      </ul>
      <div class="sec"></div>
      <h3>✅ Fortschritt</h3>
      <ul>
        <li>„Erledigt &amp; weiter“ speichert die Übung und startet die nächste.</li>
        <li>Über die Übersicht kannst du jede Übung direkt antippen.</li>
        <li>Ein neuer Tag beginnt um 3:00 Uhr nachts. Dann wird der Fortschritt vom Vortag ungültig.</li>
      </ul>
    </div>
    <button class="btn block" data-a="menu">Verstanden</button>`;
  window.scrollTo(0, 0);
}

function renderPlay(){
  const ex = LIST[S.current], isDone = S.done.includes(S.current);
  const dots = LIST.map((_, i) => `<i class="${S.done.includes(i) ? "d" : ""} ${i === S.current ? "c" : ""}"></i>`).join("");
  const finishing = isFinishing();
  const nextLabel = finishing
    ? (isDone ? "✓ Beenden" : "✓ Erledigt &amp; beenden")
    : (isDone ? "Weiter →" : "✓ Erledigt &amp; weiter");
  $app.innerHTML = `
    <div class="topnav"><button class="btn ghost navbtn" data-a="menu">📋 Zur Übersicht</button></div>
    <div class="progress">${dots}</div>
    <div class="head">
      <div class="muted">Übung ${S.current + 1} von ${N}</div>
      <div class="big">${esc(ex.name)}</div>
    </div>
    <div class="card figure">${figureSVG(ex.pose)}</div>
    <div class="card timer">
      <div class="phase" id="phase"></div>
      <div class="time" id="time">0:00</div>
      <div class="tbar" id="tbarWrap"><div id="tbar"></div></div>
      <button class="btn ghost block" id="restartBtn" data-a="restart">↻ Timer zurücksetzen</button>
    </div>
    <div class="card rules"><h3>So geht’s</h3><p>${esc(ex.text)}</p></div>
    <div class="bottom"><div class="inner">
      <button class="btn ghost" data-a="prev" ${S.current === 0 ? "disabled" : ""}>← Zurück</button>
      <button class="btn ok" id="nextBtn" data-a="next">${nextLabel}</button>
    </div></div>`;
  barEl = document.getElementById("tbar");
  timeEl = document.getElementById("time");
  phaseEl = document.getElementById("phase");
  lastTimeTxt = ""; lastPhaseTxt = "";
  updateTimerUI();
  if(T.running) tick();
}

/* ---------- Events ---------- */
let resetArmed = false, resetT = null;
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if(!el) return;
  const a = el.dataset.a, i = Number(el.dataset.i);
  switch(a){
    case "start": startButtonAction(); break;
    case "open": openExercise(i, true); break;
    case "rules": S.screen = "rules"; render(); break;
    case "menu": toMenu(); break;
    case "restart": setupTimer(true); render(); break;   /* jederzeit: startet wieder mit der Vorbereitungszeit */
    case "prev": if(S.current > 0) openExercise(S.current - 1, true); break;
    case "next": nextExercise(); break;
    case "reset":
      if(resetArmed){
        clearTimeout(resetT); resetArmed = false;
        S.done = []; S.current = 0; save(); renderHome(); toast("Fortschritt zurückgesetzt", "info");
      }else{
        resetArmed = true; el.textContent = "Sicher? Nochmal tippen";
        resetT = setTimeout(() => { resetArmed = false; el.textContent = "Heutigen Fortschritt zurücksetzen"; }, 4000);
      }
      break;
  }
});

/* Beim Laden startet nichts – erst „Beginnen“ startet die erste Übung */
save();
setupTimer(false);
render();
</script>
</body>
</html>
