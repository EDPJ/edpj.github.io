<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Spiele &amp; Tools</title>
<script src="/common.js"></script>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   NEUE EINTRÄGE HIER ERGÄNZEN
   kat: "spiele" oder "tools"
   ============================================================ */
const ITEMS = [
  {
    kat: "spiele",
    titel: "Imposter",
    text: "Wer kennt das geheime Wort nicht?",
    icon: "🕵️",
    url: "spiele/imposter.html",
    tag: ""
  },
  {
    kat: "spiele",
    titel: "Double It",
    text: "Wische und verdopple: 2, 4, 8, 16 …",
    icon: "🔢",
    url: "spiele/double-it.html",
    tag: ""
  },
  {
    kat: "spiele",
    titel: "Wizard",
    text: "Die Punktetabelle für das Stichspiel",
    icon: "🧙",
    url: "spiele/wizard.html",
    tag: ""
  },
  {
    kat: "tools",
    titel: "Dehnübungen",
    text: "Dehnübungen für jeden Tag mit Timer und Grafiken",
    icon: "🤸",
    url: "tools/dehnen.html",
    tag: ""
  },
  {
    kat: "tools",
    titel: "Klang-Tools",
    text: "Metronom, Tongenerator, Stimmgerät und Dezibelmesser",
    icon: "🎵",
    url: "tools/klang.html",
    tag: ""
  }
];

const KATEGORIEN = [
  { id: "spiele", name: "Spiele", leer: "Hier erscheinen bald Spiele." },
  { id: "tools",  name: "Tools",  leer: "Hier erscheinen bald Tools." }
];

function renderHome() {
  App.render(
    App.ui.header("SPIELE & TOOLS", "Wähle ein Tool oder Spiel und leg los") +
    KATEGORIEN.map(k =>
      App.ui.section(k.name, ITEMS.filter(it => it.kat === k.id), k.leer)
    ).join("")
  );
}

App.screens({ home: renderHome });
App.go("home");
</script>
</body>
</html>
