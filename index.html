<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Spiele & Tools</title>
<style>
  :root{
    --bg:#0b0d12; --card:#151922; --card2:#1c2230; --line:#262d3d;
    --text:#f2f4f8; --muted:#8c95a8;
    --a1:#ff3b6b; --a2:#7c5cff; --warn:#ffb020;
    --grad:linear-gradient(135deg,var(--a1),var(--a2));
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  body{min-height:100vh;
    background:
      radial-gradient(600px 300px at 10% -5%,rgba(255,59,107,.18),transparent 60%),
      radial-gradient(600px 300px at 100% 0%,rgba(124,92,255,.2),transparent 60%),
      var(--bg);
    background-attachment:fixed;}
  #app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 22px) 16px calc(env(safe-area-inset-bottom) + 40px);}
  header{text-align:center;margin-bottom:26px}
  .logo{font-size:32px;font-weight:900;letter-spacing:3px;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--muted);font-size:13px;margin-top:4px}
  .section{margin-bottom:28px}
  .section-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
  .section-head h2{margin:0;font-size:13px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700}
  .count{font-size:12px;color:var(--muted);background:var(--card2);border:1px solid var(--line);
    border-radius:99px;padding:2px 10px;font-weight:700}
  a.item,.item.soon{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:10px;
    background:var(--card);border:1px solid var(--line);border-radius:20px;
    color:inherit;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.35);
    transition:transform .12s,border-color .2s;animation:pop .3s ease both}
  a.item:active{transform:scale(.98);border-color:var(--a2)}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .icon{width:54px;height:54px;border-radius:16px;background:var(--grad);display:grid;place-items:center;
    font-size:28px;flex:none}
  .info{flex:1;min-width:0}
  .title{font-weight:800;font-size:17px}
  .text{color:var(--muted);font-size:13px;margin-top:2px;line-height:1.4}
  .tag{display:inline-block;margin-top:8px;padding:3px 10px;border-radius:99px;background:var(--card2);
    border:1px solid var(--line);font-size:11px;color:var(--warn);font-weight:700}
  .arrow{color:var(--muted);font-size:22px;flex:none}
  .item.soon{border-style:dashed;box-shadow:none;opacity:.7}
  .item.soon .icon{background:var(--card2);border:1px solid var(--line)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   NEUE EINTRÄGE HIER ERGÄNZEN
   kat: "spiele" oder "tools"
   ============================================================ */
const ITEMS = [
  {
    kat: "spiele",
    titel: "Imposter",
    text: "Wer kennt das geheime Wort nicht?",
    icon: "🕵️",
    url: "spiele/imposter.html",
    tag: ""
  },
  {
    kat: "spiele",
    titel: "Double It",
    text: "Wische und verdopple: 2, 4, 8, 16 …",
    icon: "🔢",
    url: "spiele/double-it.html",
    tag: ""
  },
  {
    kat: "spiele",
    titel: "Wizard",
    text: "Die Punktetabelle für das Stichspiel",
    icon: "🧙",
    url: "spiele/wizard.html",
    tag: ""
  },
  {
    kat: "tools",
    titel: "Dehnübungen",
    text: "Dehnübungen für jeden Tag mit Timer und Grafiken",
    icon: "🤸",
    url: "tools/dehnen.html",
    tag: ""
  }
];

const KATEGORIEN = [
  { id: "spiele", name: "Spiele", leer: "Hier erscheinen bald Spiele." },
  { id: "tools",  name: "Tools",  leer: "Hier erscheinen bald Tools." }
];

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function card(it, i){
  return `<a class="item" href="${esc(it.url)}" style="animation-delay:${i * 60}ms">
    <div class="icon">${esc(it.icon || "🎮")}</div>
    <div class="info">
      <div class="title">${esc(it.titel)}</div>
      <div class="text">${esc(it.text || "")}</div>
      ${it.tag ? `<span class="tag">${esc(it.tag)}</span>` : ""}
    </div>
    <div class="arrow">›</div>
  </a>`;
}

document.getElementById("app").innerHTML = `
  <header>
    <div class="logo">SPIELE & TOOLS</div>
    <div class="sub">Wähle ein Tool oder Spiel und leg los</div>
  </header>
  ${KATEGORIEN.map(k => {
    const list = ITEMS.filter(it => it.kat === k.id);
    return `<div class="section">
      <div class="section-head"><h2>${esc(k.name)}</h2><span class="count">${list.length}</span></div>
      ${list.length
        ? list.map(card).join("")
        : `<div class="item soon"><div class="icon">🚧</div><div class="info"><div class="title">${esc(k.leer)}</div></div></div>`}
    </div>`;
  }).join("")}
`;
</script>
</body>
</html>
