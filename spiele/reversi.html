<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Reversi</title>
<script src="/common.js"></script>
<style>
  /* Nur spielspezifisches CSS – alles andere kommt aus common.js */
  .startbox{margin-bottom:var(--sp-14)}
  .startbox .btn + .btn{margin-top:var(--sp-10)}

  /* Startseite */
  .recrow{display:flex;align-items:center;gap:var(--sp-12);padding:var(--sp-10) var(--sp-12);background:var(--card2);border:1px solid var(--line);
    border-radius:var(--r-btn);animation:app-pop var(--t-move) ease both}
  .recrow + .recrow{margin-top:var(--sp-8)}
  .recsep{height:1px;background:var(--line);margin:var(--sp-12) var(--sp-4)}
  .recrow .nm{font-weight:700;font-size:var(--fs-text)}
  .recrow .cols{display:flex;gap:var(--sp-14);flex:none}
  .recrow .col{text-align:center;min-width:46px}
  .recrow .col b{display:block;font-size:var(--fs-title);font-weight:900;font-variant-numeric:tabular-nums;line-height:1.2}
  .recrow .col small{display:block;font-size:var(--fs-xxs);letter-spacing:var(--ls-label);color:var(--muted);font-weight:700;text-transform:uppercase}
  .lastbig{text-align:center;padding:4px 0 0}
  .lastbig .num{font-size:34px;font-weight:900;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.2}
  .lastbig .lbl{font-size:var(--fs-xs);letter-spacing:var(--ls-head);color:var(--muted);font-weight:700;text-transform:uppercase}

  /* Spiel: Punktetafeln */
  .scores{display:flex;gap:var(--sp-10);margin-bottom:var(--sp-10)}
  .pl{flex:1;display:flex;align-items:center;gap:var(--sp-10);background:var(--card);border:1px solid var(--line);
    border-radius:var(--r-row);padding:var(--sp-8) var(--sp-12);transition:border-color var(--t-fade),box-shadow var(--t-fade)}
  .pl.on{border-color:var(--a2);box-shadow:0 0 18px var(--glow-a2)}
  .pl .who{min-width:0;flex:1}
  .pl .who b{display:block;font-size:var(--fs-text);font-weight:800}
  .pl .who small{display:block;font-size:var(--fs-xs);color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pl .cnt{font-size:var(--fs-stat);font-weight:900;font-variant-numeric:tabular-nums}
  .dot{width:26px;height:26px;border-radius:50%;flex:none;display:inline-block;vertical-align:middle}
  .dot.b{background:radial-gradient(circle at 35% 30%,#4b536b,#10131b 72%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.18)}
  .dot.w{background:radial-gradient(circle at 35% 30%,#fff,#bfc7d8 78%);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
  .dot.s{width:15px;height:15px;margin:-3px 3px 0 0}
  .status{text-align:center;font-weight:700;font-size:var(--fs-text);color:var(--text-soft);min-height:24px;margin-bottom:var(--sp-10)}
  .status.think::after{content:"";display:inline-block;width:1.4em;text-align:left;animation:dots 1.2s steps(4) infinite}
  @keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

  /* Brett */
  .board{position:relative;width:min(100%,max(260px,calc(100vh - 400px)));aspect-ratio:1;margin:0 auto var(--sp-14);
    background:var(--card);border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--shadow-card);
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .cells{position:absolute;inset:var(--gap);display:grid;gap:var(--gap);
    grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
  .cell{position:relative;background:rgba(var(--ok-rgb),.09);border-radius:14%;perspective:420px;-webkit-perspective:420px;cursor:default}
  .cell.lg{cursor:pointer;background:rgba(var(--ok-rgb),.14)}
  .cell.lg::before{content:"";position:absolute;inset:37%;border-radius:50%;background:rgba(var(--ok-rgb),.6);
    box-shadow:0 0 10px rgba(var(--ok-rgb),.5)}
  .cell.lg:active{background:rgba(var(--ok-rgb),.28)}
  .cell.last::after{content:"";position:absolute;inset:41%;border-radius:50%;background:var(--gold);z-index:3;
    box-shadow:0 0 0 1.5px rgba(0,0,0,.4),0 0 8px rgba(var(--gold-rgb),.8)}
  .cell.nope{animation:nope .3s}
  @keyframes nope{0%,100%{transform:none}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}

  .disc{position:absolute;inset:10%;z-index:2}
  .disc.new{animation:drop .28s ease-out backwards}
  .disc.flip{animation:lift .4s ease-in-out var(--dl,0s)}
  @keyframes drop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes lift{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
  .coin{position:absolute;inset:0;transform-style:preserve-3d;-webkit-transform-style:preserve-3d;
    transition:transform .4s ease-in-out;transition-delay:var(--dl,0s)}
  .disc.w .coin{transform:rotateY(180deg)}
  .coin i{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .coin .fb{background:radial-gradient(circle at 35% 30%,#4b536b,#10131b 72%);
    box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 0 0 2px rgba(255,255,255,.16)}
  .coin .fw{background:radial-gradient(circle at 35% 30%,#fff,#bfc7d8 78%);transform:rotateY(180deg);
    box-shadow:0 3px 8px rgba(0,0,0,.5),inset 0 -2px 0 rgba(0,0,0,.12)}

  .overlay{position:absolute;inset:0;z-index:5;border-radius:var(--r-card);background:rgba(var(--bg-rgb),.86);
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:none;flex-direction:column;
    align-items:center;justify-content:center;gap:var(--sp-10);padding:20px;text-align:center}
  .overlay.show{display:flex;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .overlay .big{font-size:var(--fs-big);font-weight:900}
  .overlay .res{font-size:var(--fs-stat);font-weight:900;font-variant-numeric:tabular-nums;
    background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .overlay p{margin:0 0 var(--sp-6);color:var(--text-soft);font-size:var(--fs-text);line-height:1.45}
  .overlay .btn{width:100%;max-width:260px}

  @media (prefers-reduced-motion:reduce){
    .coin{transition:none}
    .disc.new,.disc.flip,.cell.nope,.overlay.show{animation:none}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Konfiguration ---------- */
const N = 8;
const EMPTY = 0, BLACK = 1, WHITE = 2;
const LEVELS = ["", "Leicht", "Mittel", "Stark"];

/* ---------- Helfer ---------- */
const $ = id => document.getElementById(id);
const opp = p => 3 - p;
const cname = p => p === BLACK ? "Schwarz" : "Weiß";

/* ---------- Speicher: nur lokal (localStorage) ---------- */
const defaults = () => ({
  set:  { cpu:true, level:2, hints:true, black:true },
  game: null,
  rec:  { 1:[0,0,0], 2:[0,0,0], 3:[0,0,0], duo:[0,0,0] },
  last: null
});

/* Prüf-Helfer: alles, was aus dem Speicher kommt, wird streng validiert */
const isInt = (x, a, b) => Number.isInteger(x) && x >= a && x <= b;

function cleanLast(l){
  if(!l || typeof l !== "object") return null;
  if(typeof l.cpu !== "boolean" || !isInt(l.lv, 1, 3) || !isInt(l.h, 1, 2) ||
     !isInt(l.b, 0, 64) || !isInt(l.w, 0, 64) || !Number.isFinite(l.t)) return null;
  return { cpu:l.cpu, lv:l.lv, h:l.h, b:l.b, w:l.w, t:l.t };
}

function cleanGame(g){
  if(!g || typeof g !== "object") return null;
  if(typeof g.cpu !== "boolean" || !isInt(g.level, 1, 3) || !isInt(g.human, 1, 2)) return null;
  if(!Array.isArray(g.moves) || g.moves.length > 60 || !g.moves.every(m => isInt(m, 0, 63))) return null;
  let rec = null;
  const r = g.rec;
  if(r && typeof r === "object" && ["1","2","3","duo"].includes(r.k) && isInt(r.i, 0, 2)){
    rec = { k:r.k, i:r.i, prev:cleanLast(r.prev) };
  }
  return { cpu:g.cpu, level:g.level, human:g.human, moves:g.moves.slice(), rec };
}

const St = App.store.create("reversi", {
  defaults: defaults(),
  decode: d => {
    d = (d && typeof d === "object") ? d : {};
    const df = defaults();
    const s = (d.set && typeof d.set === "object") ? d.set : {};
    const rec = df.rec;
    for(const k in rec){
      const a = d.rec && d.rec[k];
      if(Array.isArray(a) && a.length === 3) rec[k] = a.map(x => Math.max(0, Number(x) || 0));
    }
    return {
      set: {
        cpu: s.cpu !== false,
        level: [1,2,3].includes(s.level) ? s.level : 2,
        hints: s.hints !== false,
        black: s.black !== false
      },
      game: cleanGame(d.game),
      rec,
      last: cleanLast(d.last)
    };
  }
});
let D = St.load();
const save = () => St.save(D);

/* ---------- Spielregeln (Brett, Züge) ---------- */
/* Strahlen vom Feld nach außen, nur Richtungen mit mindestens 2 Feldern */
const RAYS = [];
for(let i=0;i<64;i++){
  const r = i >> 3, c = i & 7, list = [];
  for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
    if(!dr && !dc) continue;
    const ray = [];
    let y = r + dr, x = c + dc;
    while(y>=0 && y<N && x>=0 && x<N){ ray.push(y*N + x); y += dr; x += dc; }
    if(ray.length >= 2) list.push(ray);
  }
  RAYS.push(list);
}

function newBoard(){
  const b = new Int8Array(64);
  b[27] = WHITE; b[28] = BLACK; b[35] = BLACK; b[36] = WHITE;
  return b;
}
/* Liste der Steine, die beim Setzen von p auf idx umgedreht werden (leer = ungültig) */
function flipsFor(bd, idx, p){
  if(bd[idx]) return [];
  const o = opp(p);
  let out = null;
  const rays = RAYS[idx];
  for(let a=0;a<rays.length;a++){
    const ray = rays[a];
    let k = 0;
    while(k < ray.length && bd[ray[k]] === o) k++;
    if(k > 0 && k < ray.length && bd[ray[k]] === p){
      if(!out) out = [];
      for(let j=0;j<k;j++) out.push(ray[j]);
    }
  }
  return out || [];
}
function hasMove(bd, p){
  for(let i=0;i<64;i++) if(!bd[i] && flipsFor(bd, i, p).length) return true;
  return false;
}
function legalMoves(bd, p){
  const m = [];
  for(let i=0;i<64;i++) if(!bd[i] && flipsFor(bd, i, p).length) m.push(i);
  return m;
}
function place(bd, idx, p, fl){
  bd[idx] = p;
  for(let i=0;i<fl.length;i++) bd[fl[i]] = p;
}
/* Wer ist nach einem Zug von p dran? Gegner, sonst p nochmal (Gegner passt), sonst 0 (Ende) */
function nextTurn(bd, p){
  if(hasMove(bd, opp(p))) return opp(p);
  if(hasMove(bd, p)) return p;
  return 0;
}
function count(bd, p){
  let n = 0;
  for(let i=0;i<64;i++) if(bd[i] === p) n++;
  return n;
}

/* ---------- Computer ---------- */
const W = [
  100,-20, 10,  5,  5, 10,-20,100,
  -20,-50, -2, -2, -2, -2,-50,-20,
   10, -2, -1, -1, -1, -1, -2, 10,
    5, -2, -1, -1, -1, -1, -2,  5,
    5, -2, -1, -1, -1, -1, -2,  5,
   10, -2, -1, -1, -1, -1, -2, 10,
  -20,-50, -2, -2, -2, -2,-50,-20,
  100,-20, 10,  5,  5, 10,-20,100
];

/* Bewertung aus Sicht von p: Feldwerte + Beweglichkeit */
function evaluate(bd, p){
  const o = opp(p);
  let s = 0, mine = 0, theirs = 0;
  for(let i=0;i<64;i++){
    const v = bd[i];
    if(v === p) s += W[i];
    else if(v === o) s -= W[i];
    else{
      if(flipsFor(bd, i, p).length) mine++;
      if(flipsFor(bd, i, o).length) theirs++;
    }
  }
  return s + (mine - theirs) * 6;
}
function finalScore(bd, p){
  return (count(bd, p) - count(bd, opp(p))) * 1000;
}
function search(bd, p, depth, alpha, beta, passed){
  const moves = [];
  for(let i=0;i<64;i++){
    if(bd[i]) continue;
    const f = flipsFor(bd, i, p);
    if(f.length) moves.push({ i, f });
  }
  if(!moves.length){
    if(passed) return finalScore(bd, p);
    return -search(bd, opp(p), depth, -beta, -alpha, true);
  }
  if(depth <= 0) return evaluate(bd, p);
  moves.sort((a, b) => W[b.i] - W[a.i]);
  const o = opp(p);
  let best = -Infinity;
  for(const m of moves){
    place(bd, m.i, p, m.f);
    const sc = -search(bd, o, depth - 1, -beta, -alpha, false);
    for(const x of m.f) bd[x] = o;
    bd[m.i] = EMPTY;
    if(sc > best) best = sc;
    if(best > alpha) alpha = best;
    if(alpha >= beta) break;
  }
  return best;
}

function cpuPick(bd, p, level){
  const moves = [];
  for(let i=0;i<64;i++){
    if(bd[i]) continue;
    const f = flipsFor(bd, i, p);
    if(f.length) moves.push({ i, f });
  }
  if(!moves.length) return -1;
  if(level === 1){
    /* Leicht: viel Zufall, leichte Vorliebe für viele Steine */
    let best = null, bs = -Infinity;
    for(const m of moves){
      const sc = m.f.length + Math.random() * 6;
      if(sc > bs){ bs = sc; best = m; }
    }
    return best.i;
  }
  const empties = 64 - count(bd, BLACK) - count(bd, WHITE);
  let depth = level === 2 ? 2 : 5;
  if(level === 3 && empties <= 9) depth = empties;
  /* Zufälliger Anteil in der Reihenfolge sorgt für Abwechslung bei gleichwertigen Zügen */
  moves.forEach(m => m.k = W[m.i] + Math.random() * 3);
  moves.sort((a, b) => b.k - a.k);
  const o = opp(p);
  let best = moves[0].i, bs = -Infinity;
  for(const m of moves){
    place(bd, m.i, p, m.f);
    const sc = -search(bd, o, depth - 1, -Infinity, -bs, false);
    for(const x of m.f) bd[x] = o;
    bd[m.i] = EMPTY;
    if(sc > bs){ bs = sc; best = m.i; }
  }
  return best;
}

/* ---------- Spielstand ---------- */
/* Gespeichert wird nur die Zugliste. Brett und Spieler am Zug werden daraus berechnet. */
let R = null;           // { g, bd, turn, over }
let overlay = null;
let thinking = false;
let cpuT = null;

function validGame(g){
  if(!g || typeof g.cpu !== "boolean" || ![1,2,3].includes(g.level) || ![BLACK,WHITE].includes(g.human)) return false;
  return Array.isArray(g.moves) && g.moves.length <= 60 && g.moves.every(m => Number.isInteger(m) && m >= 0 && m < 64);
}
function build(g){
  if(!validGame(g)) return null;
  const bd = newBoard();
  let turn = BLACK;
  for(const m of g.moves){
    if(!turn) return null;
    const fl = flipsFor(bd, m, turn);
    if(!fl.length) return null;
    place(bd, m, turn, fl);
    turn = nextTurn(bd, turn);
  }
  return { g, bd, turn, over: turn === 0 };
}
const humanToMove = () => R && !R.over && (!R.g.cpu || R.turn === R.g.human);
const minMoves = g => (g.cpu && g.human === WHITE) ? 1 : 0;   // Computer als Schwarz eröffnet immer

function nameOf(p){
  if(R && R.g.cpu) return p === R.g.human ? "Du" : "Computer";
  return cname(p);
}
function resultOf(g, b, w){
  if(b === w) return "draw";
  const win = b > w ? BLACK : WHITE;
  if(!g.cpu) return win === BLACK ? "black" : "white";
  return win === g.human ? "win" : "lose";
}
function resultText(g, b, w){
  switch(resultOf(g, b, w)){
    case "draw": return "Unentschieden";
    case "win": return "Du hast gewonnen!";
    case "lose": return "Computer gewinnt";
    case "black": return "Schwarz gewinnt";
    default: return "Weiß gewinnt";
  }
}

function recordResult(){
  const g = R.g;
  if(g.rec) return;
  const b = count(R.bd, BLACK), w = count(R.bd, WHITE);
  const k = g.cpu ? String(g.level) : "duo";
  const res = resultOf(g, b, w);
  const i = res === "draw" ? 1 : (res === "win" || res === "black") ? 0 : 2;
  D.rec[k][i]++;
  g.rec = { k, i, prev: D.last };
  D.last = { cpu:g.cpu, lv:g.level, h:g.human, b, w, t:Date.now() };
}
function revertResult(){
  const g = R.g;
  if(!g.rec) return;
  const r = g.rec;
  if(Object.prototype.hasOwnProperty.call(D.rec, r.k) && isInt(r.i, 0, 2)){
    D.rec[r.k][r.i] = Math.max(0, D.rec[r.k][r.i] - 1);
  }
  D.last = r.prev || null;
  g.rec = null;
}

function play(idx){
  if(!R || R.over) return false;
  const p = R.turn;
  const fl = flipsFor(R.bd, idx, p);
  if(!fl.length) return false;
  place(R.bd, idx, p, fl);
  R.g.moves.push(idx);
  R.turn = nextTurn(R.bd, p);
  R.over = R.turn === 0;
  if(R.over){
    recordResult();
    overlay = "over";
  }else if(R.turn === p){
    const q = opp(p);
    App.toast(R.g.cpu ? (q === R.g.human ? "Du musst passen" : "Computer muss passen") : cname(q) + " muss passen");
  }
  save();
  paint(true);
  schedCpu();
  return true;
}

function schedCpu(){
  clearTimeout(cpuT);
  thinking = false;
  if(App.screen !== "play" || !R || R.over || !R.g.cpu || R.turn === R.g.human){ return; }
  thinking = true;
  updateUI();
  cpuT = setTimeout(() => {
    if(App.screen !== "play" || !R || R.over || !R.g.cpu || R.turn === R.g.human){ thinking = false; return; }
    const m = cpuPick(R.bd, R.turn, R.g.level);
    thinking = false;
    if(m < 0 || !play(m)) updateUI();
  }, 750);   // wartet, bis das Umdrehen des eigenen Zugs fertig ist (sonst ruckelt die Animation)
}

function undo(){
  if(!R || R.g.moves.length <= minMoves(R.g)){ App.toast("Kein Zug zum Zurücknehmen"); return; }
  clearTimeout(cpuT);
  thinking = false;
  const g = R.g;
  revertResult();
  g.moves.pop();
  let rt = build(g);
  /* gegen den Computer: bis zum letzten eigenen Zug zurück */
  while(g.cpu && rt && rt.turn !== g.human && g.moves.length > minMoves(g)){
    g.moves.pop();
    rt = build(g);
  }
  R = rt;
  overlay = null;
  save();
  paint(true);
  schedCpu();
}

function startGame(fresh){
  let g = D.game;
  let rt = fresh ? null : build(g);
  if(!rt || rt.over){
    g = { cpu:D.set.cpu, level:D.set.level, human:D.set.black ? BLACK : WHITE, moves:[], rec:null };
    D.game = g;
    rt = build(g);
  }
  R = rt;
  overlay = R.over ? "over" : null;
  save();
  App.go("play");
}

/* ---------- Screens ---------- */
function recRows(){
  const rows = [1,2,3].map(lv => ({ nm:LEVELS[lv], v:D.rec[lv], l:["Siege","Remis","Verl."] }));
  rows.push({ nm:"Zu zweit", v:D.rec.duo, l:["Schwarz","Remis","Weiß"] });
  return rows.map((r, n) => (n === 3 ? '<div class="recsep"></div>' : "") + `<div class="recrow">
      <div class="grow nm">${App.esc(r.nm)}</div>
      <div class="cols">${r.v.map((x, k) => `<div class="col"><b>${x}</b><small>${r.l[k]}</small></div>`).join("")}</div>
    </div>`).join("");
}

function renderHome(){
  const rt = D.game ? build(D.game) : null;
  const running = !!rt && rt.g.moves.length > 0 && !rt.over;
  const s = D.set;

  let last;
  if(D.last){
    const L = D.last;
    const g = { cpu:L.cpu, human:L.h };
    const txt = resultText(g, L.b, L.w);
    const when = App.fmt.date(L.t) + ", " + new Date(L.t).toLocaleTimeString("de-DE", {hour:"2-digit", minute:"2-digit"});
    last = `<div class="lastbig"><div class="num">${App.esc(txt)}</div><div class="lbl">${L.b} : ${L.w} (Schwarz : Weiß)</div></div>
      <div class="chips">
        ${App.ui.chip(L.cpu ? "Computer · " + LEVELS[L.lv] : "Zu zweit")}
        ${App.ui.chip(when)}
      </div>`;
  }else{
    last = App.ui.empty("Noch kein Spiel beendet.");
  }

  const startHtml = running
    ? App.ui.btn("▶ Weiterspielen", { big:true, block:true, action:"cont",
        sub:"(" + count(rt.bd, BLACK) + " : " + count(rt.bd, WHITE) + ")" }) +
      App.ui.btn("Neues Spiel", { kind:"ghost", block:true, action:"start", confirm:true })
    : App.ui.btn("▶ Spiel starten", { big:true, block:true, action:"start" });

  const items = [
    { type:"switch", title:"Gegen Computer", desc:"Aus: zu zweit an einem Gerät", on:s.cpu, action:"tcpu", label:"Gegen Computer" }
  ];
  if(s.cpu){
    items.push({ type:"stepper", title:"Stärke", desc:LEVELS[s.level], value:s.level, dec:"lvdec", inc:"lvinc" });
    items.push({ type:"switch", title:"Ich spiele Schwarz", desc:"Schwarz beginnt", on:s.black, action:"tblack", label:"Ich spiele Schwarz" });
  }
  items.push({ type:"switch", title:"Mögliche Züge zeigen", desc:"Grüne Punkte auf dem Brett", on:s.hints, action:"thints", label:"Mögliche Züge zeigen" });

  App.render(
    App.ui.topbar([], { info:true }) +
    App.ui.header("REVERSI", "Umzingle und drehe die Steine um") +
    `<div class="startbox">${startHtml}</div>` +
    App.ui.settings(items) +
    (running ? App.ui.hint("Gegner und Stärke gelten für das nächste neue Spiel.") : "") +
    App.ui.card("Bilanz", recRows()) +
    App.ui.card("Letztes Ergebnis", last) +
    App.ui.storageCard([
      { kind:"resetRecord", run:() => { D.rec = defaults().rec; D.last = null; if(D.game) D.game.rec = null; save(); } },
      { kind:"clearAll",    run:() => { D = defaults(); R = null; save(); } }
    ])
  );
}

function renderRules(){
  App.render(App.ui.rules({
    sub: "So funktioniert Reversi",
    sections: [
      { h:"🎯 Ziel", p:"Am Ende des Spiels hast du **mehr Steine deiner Farbe** auf dem Brett als dein Gegner." },
      { h:"⚫ Start", p:"Gespielt wird auf 8 × 8 Feldern. In der Mitte liegen vier Steine, **Schwarz beginnt**. Danach wechseln sich beide Seiten ab." },
      { h:"👆 Ein Zug", p:"Tippe auf ein leeres Feld. Der Stein muss mindestens einen gegnerischen Stein **einschließen**:",
        ul:[
          "Zwischen dem neuen Stein und einem deiner Steine liegt eine **ununterbrochene Reihe** gegnerischer Steine.",
          "Das gilt waagerecht, senkrecht und diagonal, auch in mehrere Richtungen gleichzeitig.",
          "Alle eingeschlossenen Steine werden **umgedreht** und gehören dir."
        ] },
      { h:"⏭️ Passen", p:"Kannst du keinen gültigen Zug machen, wird dein Zug **automatisch übersprungen**. Der Gegner ist dann nochmal dran." },
      { h:"🏁 Ende", p:"Das Spiel endet, wenn das Brett voll ist oder keiner mehr ziehen kann. Wer mehr Steine hat, gewinnt. Gleich viele Steine ergeben ein Unentschieden." },
      { h:"🧭 Hilfen", ul:[
        "**Grüne Punkte** zeigen alle Felder, auf die du setzen darfst (in den Einstellungen abschaltbar).",

      ] },
      { h:"🤖 Computer", ul:[
        "**Leicht:** spielt fast zufällig.",
        "**Mittel:** denkt zwei Züge voraus.",
        "**Stark:** denkt mehrere Züge voraus und rechnet das Ende genau aus."
      ] },
      { h:"💡 Tipps", ul:[
        "**Ecken** sind Gold wert: Steine dort können nie umgedreht werden.",
        "Die Felder **neben den Ecken** verschenken oft die Ecke an den Gegner.",
        "Wenige eigene Steine am Anfang sind kein Nachteil: Wichtiger ist, dass du **viele Zugmöglichkeiten** behältst.",
        "Spielstand, Bilanz und letztes Ergebnis werden automatisch gespeichert."
      ] }

}

const cells = [];

function renderPlay(){
  const g = R.g;
  const sub = p => g.cpu ? (p === g.human ? "Du" : "Computer") : "Spieler " + p;
  App.render(
    App.ui.topbar([], { menu:true, info:true }) +
    App.ui.header("REVERSI", "", "md") +
    `<div class="scores">
      <div class="pl" id="plB"><span class="dot b"></span><div class="who"><b>Schwarz</b><small>${sub(BLACK)}</small></div><div class="cnt" id="cB">2</div></div>
      <div class="pl" id="plW"><span class="dot w"></span><div class="who"><b>Weiß</b><small>${sub(WHITE)}</small></div><div class="cnt" id="cW">2</div></div>
    </div>
    <div class="status" id="status"></div>
    <div class="board" id="board">
      <div class="cells" id="cells">${Array.from({length:64}, (_, k) => `<div class="cell" data-a="cell" data-i="${k}"></div>`).join("")}</div>
      <div class="overlay" id="overlay"></div>
    </div>
    <div class="row">
      <button class="btn grow" id="undoBtn" data-a="undo">↶ Zug zurück</button>
      <button class="btn ghost grow" id="newBtn" data-a="newgame">Neues Spiel</button>
    </div>
    <div class="hint" id="hint"></div>`
  );
  $("board").style.setProperty("--gap", "4px");
  cells.length = 0;
  $("cells").querySelectorAll(".cell").forEach(el => cells.push(el));
  paint(false);
  schedCpu();
}

/* Zeichnet Steine und Markierungen. Vorhandene Steine bleiben erhalten, damit das Umdrehen animiert. */
function paint(animate){
  if(!cells.length || !R) return;
  const moves = R.g.moves;
  const last = moves.length ? moves[moves.length - 1] : -1;
  const lr = last >> 3, lc = last & 7;
  const hints = D.set.hints && !overlay && humanToMove();
  const legal = new Set(hints ? legalMoves(R.bd, R.turn) : []);

  for(let k=0;k<64;k++){
    const el = cells[k], v = R.bd[k], prev = Number(el.dataset.v || 0);
    if(v !== prev){
      const disc = el.querySelector(".disc");
      if(v === EMPTY){
        if(disc) disc.remove();
      }else if(prev === EMPTY || !disc){
        const d = document.createElement("div");
        d.className = "disc" + (v === WHITE ? " w" : "") + (animate && k === last ? " new" : "");
        d.innerHTML = '<div class="coin"><i class="fb"></i><i class="fw"></i></div>';
        el.insertBefore(d, el.firstChild);
      }else{
        const dist = Math.max(Math.abs((k >> 3) - lr), Math.abs((k & 7) - lc));
        disc.style.setProperty("--dl", animate ? Math.max(0, dist - 1) * 0.05 + "s" : "0s");
        disc.classList.toggle("w", v === WHITE);
        if(animate){
          disc.classList.remove("flip");
          void disc.offsetWidth;
          disc.classList.add("flip");
          clearTimeout(disc._ft);
          disc._ft = setTimeout(() => disc.classList.remove("flip"), 900);
        }
      }
      el.dataset.v = v;
    }
    el.classList.toggle("lg", legal.has(k));
    el.classList.toggle("last", k === last);
  }
  updateUI();
}

function updateUI(){
  if(!R || !$("status")) return;
  const g = R.g;
  const b = count(R.bd, BLACK), w = count(R.bd, WHITE);
  $("cB").textContent = b;
  $("cW").textContent = w;
  $("plB").classList.toggle("on", !R.over && R.turn === BLACK);
  $("plW").classList.toggle("on", !R.over && R.turn === WHITE);

  const st = $("status");
  const dot = p => `<span class="dot s ${p === BLACK ? "b" : "w"}"></span>`;
  st.className = "status";
  if(R.over){
    st.innerHTML = App.esc(resultText(g, b, w));
  }else if(thinking){
    st.classList.add("think");
    st.innerHTML = dot(R.turn) + "Computer denkt";
  }else if(g.cpu){
    st.innerHTML = dot(R.turn) + "Du bist dran";
  }else{
    st.innerHTML = dot(R.turn) + cname(R.turn) + " ist dran";
  }

  const canUndo = g.moves.length > minMoves(g);
  $("undoBtn").textContent = "↶ Zug zurück" + (canUndo ? " (" + (g.moves.length - minMoves(g)) + ")" : "");
  $("undoBtn").disabled = !canUndo;
  $("newBtn").toggleAttribute("data-confirm", g.moves.length > 0 && !R.over);

  const ov = $("overlay");
  if(overlay === "over"){
    const res = resultOf(g, b, w);
    const head = res === "win" ? "🎉 Gewonnen!" : res === "lose" ? "Verloren" : res === "draw" ? "Unentschieden" : (res === "black" ? "Schwarz" : "Weiß") + " gewinnt";
    ov.innerHTML = `<div class="big">${head}</div>
      <div class="res">${b} : ${w}</div>
      <p>Schwarz ${b} · Weiß ${w}</p>
      <button class="btn ok" data-a="newnow">Neues Spiel</button>
      <button class="btn ghost" data-a="dismiss">Brett ansehen</button>
      <button class="btn ghost" data-a="undo">↶ Zug zurück</button>`;
    ov.classList.add("show");
  }else{
    ov.classList.remove("show");
    ov.innerHTML = "";
  }
  const h = $("hint");
  h.textContent = App.store.status();
  h.className = "hint" + (App.store.ok ? "" : " warn");
}

/* ---------- Events ---------- */
App.on((a, el, i) => {
  switch(a){
    case "start": startGame(true); break;
    case "cont": startGame(false); break;
    case "newgame": startGame(true); App.toast("Neues Spiel gestartet"); break;
    case "newnow": startGame(true); break;
    case "undo": undo(); break;
    case "dismiss": overlay = null; paint(false); break;
    case "cell":
      if(!humanToMove() || overlay || thinking) return true;
      if(R.bd[i] !== EMPTY) return true;
      if(!play(i)){
        el.classList.remove("nope");
        void el.offsetWidth;
        el.classList.add("nope");
      }
      return true;
    case "tcpu": D.set.cpu = !D.set.cpu; save(); App.refresh(); return true;
    case "tblack": D.set.black = !D.set.black; save(); App.refresh(); return true;
    case "thints": D.set.hints = !D.set.hints; save(); App.refresh(); return true;
    case "lvdec": D.set.level = Math.max(1, D.set.level - 1); save(); App.refresh(); return true;
    case "lvinc": D.set.level = Math.min(3, D.set.level + 1); save(); App.refresh(); return true;
  }
});

/* Tastatur: Z = Zug zurück */
document.addEventListener("keydown", e => {
  if(App.screen !== "play") return;
  if(e.key === "z" || e.key === "Z" || e.key === "u" || e.key === "Backspace"){
    e.preventDefault(); undo();
  }
});

/* ---------- Start ---------- */
App.screens({ home: renderHome, rules: renderRules, play: renderPlay });
App.store.check();
save();
App.go("home");
</script>
