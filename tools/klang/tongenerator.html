<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tongenerator</title>
<script src="/common.js"></script>
<style>
/* Nur Seiten-Eigenes. Farben, Karten, Buttons, Leisten, Toasts, Schalter, Spielerzeilen kommen aus common.js */
.card.tc{text-align:center}
.mt10{margin-top:var(--sp-10)}
.mt12{margin-top:var(--sp-12)}
.mt14{margin-top:var(--sp-14)}

/* große Zahl */
.num{font-size:84px;font-weight:900;line-height:1.05}
.num.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.unit{color:var(--muted);font-size:var(--fs-text);font-weight:600;margin-top:2px}
.btn.small{padding:var(--sp-10) var(--sp-14);font-size:var(--fs-base);border-radius:var(--r-small)}

/* Schieberegler */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:var(--r-pill);
  background:var(--card2);border:1px solid var(--line);outline:none;margin:var(--sp-16) 0 var(--sp-4)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;
  background:var(--grad);border:0;box-shadow:0 2px 10px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border-radius:50%;background:var(--a1);border:0}
.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-xs);font-variant-numeric:tabular-nums}

/* Zahleneingabe */
input[type=number]{font:inherit;font-weight:800;font-size:var(--fs-stat);text-align:center;color:var(--text);
  background:var(--card2);border:1px solid var(--line);border-radius:var(--r-btn);padding:var(--sp-10);width:130px;
  font-variant-numeric:tabular-nums;-moz-appearance:textfield;outline:none;transition:border var(--t-fade)}
input[type=number]:focus{border-color:var(--a2)}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Auswahl-Leiste (Schnellauswahl, Wellenform) */
.seg{display:flex;flex-wrap:wrap;gap:var(--sp-8)}
.seg button{flex:1 1 auto;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-small);
  padding:var(--sp-10) var(--sp-12);font-weight:700;font-size:var(--fs-text);color:var(--muted);
  transition:transform var(--t-press),border-color var(--t-fade)}
.seg button:active{transform:scale(.97)}
.seg button.on{color:#fff;border-color:var(--a2);background:rgba(var(--a2-rgb),.22)}

/* Speicher */
.card h2 .count{margin-left:var(--sp-6);letter-spacing:0;vertical-align:1px}
.player .load{flex:1;min-width:0;background:none;text-align:left;padding:0}
.player .load:active{opacity:.7}

@media (max-width:360px){.num{font-size:64px}}
</style>
</head>
<body>
<div id="app"></div>

<script>
(function () {
"use strict";

const $ = id => document.getElementById(id);
const ui = App.ui;
const NAMES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","B","H"];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

const PRESETS = [
  ["A 440", 440], ["C 262", 261.63], ["E 330", 329.63],
  ["100 Hz", 100], ["1 kHz", 1000], ["5 kHz", 5000], ["10 kHz", 10000]
];

/* ---------- Wellenformen ----------
   native: eingebaute Form des Browsers
   build:  Obertonreihe für eine eigene Wellenform (PeriodicWave)
   lvl:    Pegelanpassung, damit die Formen ähnlich laut klingen */
const HN = 64;
function pulse(d){
  const re = new Float32Array(HN + 1), im = new Float32Array(HN + 1);
  for(let n = 1; n <= HN; n++){
    re[n] = Math.sin(2 * Math.PI * n * d) / (n * Math.PI);
    im[n] = (1 - Math.cos(2 * Math.PI * n * d)) / (n * Math.PI);
  }
  return [re, im];
}
function halfwave(){
  const re = new Float32Array(HN + 1), im = new Float32Array(HN + 1);
  for(let n = 2; n <= HN; n += 2) re[n] = -4 / (Math.PI * (n * n - 1));
  return [re, im];
}
function harm(list){
  const re = new Float32Array(list.length + 1), im = new Float32Array(list.length + 1);
  list.forEach((a, i) => { im[i + 1] = a; });
  return [re, im];
}
const WAVES = [
  { id:"sine",     name:"Sinus",      native:true, lvl:1 },
  { id:"square",   name:"Rechteck",   native:true, lvl:.6 },
  { id:"sawtooth", name:"Sägezahn",   native:true, lvl:.7 },
  { id:"triangle", name:"Dreieck",    native:true, lvl:.95 },
  { id:"pulse25",  name:"Puls 25 %",  build:() => pulse(.25),  lvl:.65 },
  { id:"pulse12",  name:"Puls 12 %",  build:() => pulse(.125), lvl:.6 },
  { id:"half",     name:"Halbwelle",  build:halfwave,          lvl:1 },
  { id:"organ",    name:"Orgel",      build:() => harm([1,.6,.4,.3,0,.2,0,.1]), lvl:.9 },
  { id:"flute",    name:"Flöte",      build:() => harm([1,.35,.08,.04]), lvl:1 },
  { id:"clarinet", name:"Klarinette", build:() => harm([1,0,.75,0,.5,0,.14,0,.5,0,.12,0,.17]), lvl:.8 },
  { id:"trumpet",  name:"Trompete",   build:() => harm([1,.9,.8,.65,.5,.4,.3,.2,.15,.1]), lvl:.65 }
];
const WAVE_BY_ID = {};
WAVES.forEach(w => WAVE_BY_ID[w.id] = w);

const VOL_NORMAL = 0.5, VOL_LOUD = 0.85;

let freq = 440, wave = "sine", loud = false;
let ctx = null, master = null, voice = null, playing = false, warned = false;
const waveCache = {};

/* Regler (logarithmisch) <-> Frequenz */
const sToF = s => 20 * Math.pow(1000, s / 1000);
const fToS = f => 1000 * Math.log(f / 20) / Math.log(1000);

function noteInfo(f){
  const n = 12 * Math.log2(f / 440) + 69, m = Math.round(n);
  return { name: NAMES[((m % 12) + 12) % 12] + (Math.floor(m / 12) - 1), cents: Math.round((n - m) * 100) };
}
function fmtF(f){ return f >= 1000 ? String(Math.round(f * 10) / 10) : String(Math.round(f * 100) / 100); }

function setFreq(f, fromSlider){
  freq = clamp(Number(f) || 440, 20, 20000);
  $("fbig").textContent = fmtF(freq);
  if(!fromSlider) $("fslider").value = fToS(freq);
  if(document.activeElement !== $("fnum")) $("fnum").value = fmtF(freq);
  const ni = noteInfo(freq);
  $("fnote").textContent = ni.name;
  $("fcents").textContent = (ni.cents > 0 ? "+" : "") + ni.cents + " ct";
  if(voice && ctx) voice.o.frequency.setTargetAtTime(freq, ctx.currentTime, 0.015);
}

function stepFreq(d){
  const t = Math.round(freq) + d;
  if(t > 20000) App.toast("Maximum erreicht: 20 000 Hz", "warn", 2000);
  else if(t < 20) App.toast("Minimum erreicht: 20 Hz", "warn", 2000);
  setFreq(t);
}

/* Sprung zum nächsthöheren / nächsttieferen Ton (Halbtonschritt, A4 = 440 Hz) */
function stepNote(dir){
  const n = 12 * Math.log2(freq / 440) + 69, r = Math.round(n);
  const m = Math.abs(n - r) < 0.01 ? r + dir : (dir > 0 ? Math.ceil(n) : Math.floor(n));
  const f = 440 * Math.pow(2, (m - 69) / 12);
  if(f > 20000){ App.toast("Maximum erreicht: 20 000 Hz", "warn", 2000); return; }
  if(f < 19.99){ App.toast("Minimum erreicht: 20 Hz", "warn", 2000); return; }
  setFreq(f);
}

/* ---------- Lautstärke ---------- */
function volGain(){
  const v = loud ? VOL_LOUD : VOL_NORMAL;
  return v * v * 0.8;               /* quadratisch: feinere Regelung im leisen Bereich */
}
function updateVol(){
  const card = $("volCard");
  card.querySelector("h2").textContent = "Lautstärke · " + Math.round((loud ? VOL_LOUD : VOL_NORMAL) * 100) + " %";
  const sw = card.querySelector(".switch");
  sw.classList.toggle("on", loud);
  sw.setAttribute("aria-checked", loud ? "true" : "false");
  if(master && ctx) master.gain.setTargetAtTime(volGain(), ctx.currentTime, 0.03);
}

/* ---------- Audio ---------- */
function ensureCtx(){
  if(ctx) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  try{ ctx = new AC({ latencyHint: "playback" }); }   /* größerer Puffer = weniger Knacken */
  catch(e){ ctx = new AC(); }
  master = ctx.createGain();
  master.gain.value = volGain();
  master.connect(ctx.destination);
}

function setOscWave(o, id){
  const w = WAVE_BY_ID[id];
  if(w.native){ o.type = id; return; }
  if(!waveCache[id]){
    const [re, im] = w.build();
    waveCache[id] = ctx.createPeriodicWave(re, im);
  }
  o.setPeriodicWave(waveCache[id]);
}

/* Jede Stimme hat eine eigene Hüllkurve: weich ein- und ausblenden verhindert Knacken */
function makeVoice(){
  const t = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  setOscWave(o, wave);
  o.frequency.value = freq;
  g.gain.value = 0;
  o.connect(g); g.connect(master);
  o.start(t);
  g.gain.setTargetAtTime(WAVE_BY_ID[wave].lvl, t, 0.02);
  o.onended = () => { try{ o.disconnect(); g.disconnect(); }catch(e){} };
  return { o, g };
}
function fadeOut(v){
  const t = ctx.currentTime;
  v.g.gain.setTargetAtTime(0, t, 0.02);
  try{ v.o.stop(t + 0.4); }catch(e){}
}

const goBtn = () => document.querySelector('.bottom [data-a="go"]');

async function start(){
  try{
    ensureCtx();
    await ctx.resume();
  }catch(e){ App.toast("Audio wird von diesem Browser nicht unterstützt", "warn", 4000); return; }
  if(voice) fadeOut(voice);
  voice = makeVoice();
  playing = true;
  App.wake.on();
  goBtn().textContent = "■ Stopp";
  goBtn().classList.add("bad");
  if(!warned){
    warned = true;
    App.toast("⚠️ Lautstärke niedrig halten: Sehr hohe und tiefe Töne belasten Gehör und Lautsprecher", "warn", 5000);
  }else{
    App.toast("Ton läuft · " + fmtF(freq) + " Hz", "success", 1500);
  }
}

function stop(){
  if(!voice) return;
  fadeOut(voice);
  voice = null;
  playing = false;
  App.wake.off();
  goBtn().textContent = "▶ Ton abspielen";
  goBtn().classList.remove("bad");
  App.toast("Ton gestoppt", "info", 1500);
}

function setWave(id){
  if(!WAVE_BY_ID[id]) return;
  wave = id;
  document.querySelectorAll("#waves button").forEach(x => x.classList.toggle("on", x.dataset.w === id));
  if(voice){                          /* Überblenden statt hartem Umschalten */
    const old = voice;
    voice = makeVoice();
    fadeOut(old);
  }
}

/* ---------- Speicher (lokal, mit Löschmöglichkeit) ---------- */
const MAX_SAVED = 20;
const st = App.store.create("tongenerator_data", {
  defaults: { saved: [] },
  decode: d => ({
    saved: (Array.isArray(d && d.saved) ? d.saved : [])
      .map(t => ({ f: Number(t.f), w: String(t.w) }))
      .filter(t => t.f >= 20 && t.f <= 20000 && WAVE_BY_ID[t.w])
      .slice(0, MAX_SAVED)
  })
});
let saved = [];

function saveStore(){ st.save({ saved }); }

function renderSaved(){
  $("scount").textContent = saved.length;
  $("saved").innerHTML = saved.length
    ? saved.map((t, i) => `<div class="player">${ui.avatar(noteInfo(t.f).name)}
        <button class="load" data-a="load" data-i="${i}">
          <div class="pname">${App.esc(fmtF(t.f))} Hz</div>
          <div class="psub">${App.esc(noteInfo(t.f).name)} · ${App.esc(WAVE_BY_ID[t.w].name)}</div>
        </button>
        <button class="icon" data-a="del" data-i="${i}" aria-label="Löschen">✕</button>
      </div>`).join("")
    : ui.empty("Noch nichts gespeichert.");
  document.querySelector('[data-a="clear"]').disabled = saved.length === 0;
  const hint = $("storeHint");
  hint.textContent = App.store.status();
  hint.classList.toggle("warn", !App.store.ok);
}

/* ---------- Aufbau ---------- */
const stepBtn = (label, action) => ui.btn(label, { kind: "ghost", grow: true, cls: "small", action });

function renderMain(){
  App.render(
    ui.topbar([{ label: "🎵 Klang-Tools", href: "../klang.html" }]) +
    ui.header("TONGENERATOR", "Erzeuge Töne von 20 bis 20 000 Hz", "md") +

    ui.card("Frequenz",
      `<div class="num grad" id="fbig">440</div>
       <div class="unit">Hertz · Ton <b id="fnote">A4</b> <span id="fcents" class="muted"></span></div>
       <div class="row mt14">${stepBtn("−10", "step:-10")}${stepBtn("−1", "step:-1")}${stepBtn("+1", "step:1")}${stepBtn("+10", "step:10")}</div>
       <div class="row mt10">${stepBtn("▼ Ton tiefer", "note:-1")}${stepBtn("Ton höher ▲", "note:1")}</div>
       <input type="range" id="fslider" min="0" max="1000" value="0" aria-label="Frequenz">
       <div class="scale"><span>20 Hz</span><span>200</span><span>2 000</span><span>20 000 Hz</span></div>
       <div class="mt14"><input type="number" id="fnum" min="20" max="20000" step="1" value="440" inputmode="decimal"> <span class="muted">Hz</span></div>`,
      "tc") +

    ui.card("Schnellauswahl",
      `<div class="seg" id="presets">${PRESETS.map(p =>
        `<button data-a="preset" data-f="${p[1]}">${App.esc(p[0])}</button>`).join("")}</div>`) +

    ui.card("Wellenform",
      `<div class="seg" id="waves">${WAVES.map(w =>
        `<button data-a="wave" data-w="${w.id}"${w.id === wave ? ' class="on"' : ""}>${App.esc(w.name)}</button>`).join("")}</div>`) +

    `<div id="volCard">${ui.settings([{ type: "switch", title: "Lauter · 85 %", on: loud, action: "loud", label: "Lauter" }], "Lautstärke · 50 %")}</div>` +

    `<div class="card"><h2>Speicher<span class="count" id="scount">0</span></h2>
       ${ui.btn("💾 Aktuellen Ton speichern", { kind: "ghost", block: true, action: "save" })}
       <div id="saved"></div>
       ${ui.btn("Alle gespeicherten Töne löschen", { kind: "ghost", block: true, action: "clear", confirm: true, cls: "mt12" })}
       <div class="hint" id="storeHint"></div>
     </div>` +

    ui.bottom(ui.btn("▶ Ton abspielen", { block: true, action: "go" }))
  );

  $("fslider").addEventListener("input", e => setFreq(sToF(Number(e.target.value)), true));
  $("fnum").addEventListener("input", e => { if(e.target.value !== "") setFreq(e.target.value); });
  $("fnum").addEventListener("blur", e => {
    const v = Number(e.target.value);
    if(e.target.value !== "" && (v < 20 || v > 20000)) App.toast("Gültiger Bereich: 20 bis 20 000 Hz", "warn", 2500);
    e.target.value = fmtF(freq);
  });

  setFreq(freq);
  updateVol();
  renderSaved();
}

/* ---------- Aktionen ---------- */
App.on((a, el, i) => {
  if(a.indexOf("step:") === 0){ stepFreq(Number(a.slice(5))); return true; }
  if(a.indexOf("note:") === 0){ stepNote(Number(a.slice(5))); return true; }
  switch(a){
    case "preset": setFreq(Number(el.dataset.f)); return true;
    case "wave":   setWave(el.dataset.w); return true;
    case "loud":
      loud = !loud;
      updateVol();
      if(loud) App.toast("⚠️ Lautstärke auf 85 % erhöht", "warn", 2500);
      else App.toast("Lautstärke: 50 %", "info", 1500);
      return true;
    case "go": playing ? stop() : start(); return true;
    case "save": {
      const f = Math.round(freq * 100) / 100;
      if(saved.some(t => t.f === f && t.w === wave)){ App.toast("Dieser Ton ist schon gespeichert", "info", 2000); return true; }
      if(saved.length >= MAX_SAVED){ App.toast("Speicher voll – bitte erst einen Ton löschen", "warn", 2500); return true; }
      saved.push({ f, w: wave });
      saveStore(); renderSaved();
      App.toast("Ton gespeichert", "success", 1500);
      return true;
    }
    case "load": {
      const t = saved[i]; if(!t) return true;
      setFreq(t.f);
      setWave(t.w);
      return true;
    }
    case "del":
      if(saved[i]){
        saved.splice(i, 1);
        saveStore(); renderSaved();
        App.toast("Ton gelöscht", "info", 1500);
      }
      return true;
    case "clear":                     /* kommt erst nach der Sicherheitsabfrage an */
      saved = [];
      saveStore(); renderSaved();
      App.toast(App.text.msg.clearAll, "info", 1500);
      return true;
  }
});

document.addEventListener("visibilitychange", () => {
  if(document.hidden || !playing) return;
  if(ctx && ctx.state !== "running") ctx.resume().catch(() => {});
});

App.store.check();
saved = st.load().saved;
App.screens({ home: renderMain });
App.go("home");

})();
</script>
</body>
</html>
