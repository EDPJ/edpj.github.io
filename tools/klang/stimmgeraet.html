<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stimmgerät</title>
<!-- Gemeinsame Bausteine (muss das ERSTE Skript sein) -->
<script src="/common.js"></script>
<style>
/* Nur seiteneigenes CSS – alles andere kommt aus common.js */
.display{text-align:center}
.note{font-size:96px;font-weight:900;line-height:1;margin:var(--sp-4) 0 2px;min-height:96px;
  font-variant-numeric:tabular-nums;transition:color var(--t-fade)}
.note sub{font-size:32px;font-weight:700;vertical-align:baseline;margin-left:2px;color:var(--muted)}
.note.idle{color:var(--line)}
.note.good{color:var(--ok)}
.note.off{color:var(--warn)}
.hz{color:var(--muted);font-size:var(--fs-base);font-variant-numeric:tabular-nums;min-height:1.4em}

.meter{position:relative;height:46px;margin:var(--sp-18) var(--sp-6) var(--sp-4)}
.meter .track{position:absolute;left:0;right:0;top:20px;height:8px;border-radius:var(--r-pill);
  background:var(--card2);border:1px solid var(--line)}
.meter .zone{position:absolute;left:46%;width:8%;top:20px;height:8px;background:rgba(var(--ok-rgb),.35)}
.meter .tick{position:absolute;top:14px;width:2px;height:20px;background:var(--line);transform:translateX(-1px)}
.meter .tick.mid{background:var(--muted);top:10px;height:28px}
.needle{position:absolute;top:6px;width:6px;height:36px;border-radius:9px;background:var(--line);
  left:50%;transform:translateX(-50%);transition:left .12s linear,background var(--t-fade);will-change:left}
.needle.on{background:var(--grad)}
.needle.good{background:var(--ok)}

.scale{display:flex;justify-content:space-between;color:var(--muted);font-size:var(--fs-hint);
  margin:0 0 var(--sp-4);font-variant-numeric:tabular-nums}

.status{margin-top:var(--sp-12);font-size:var(--fs-text);font-weight:600;color:var(--muted);min-height:1.4em}
.status.good{color:var(--ok)}
.status.off{color:var(--warn)}

.btn.stop{background:var(--card2);border:1px solid var(--a1);color:var(--a1)}

@media (max-width:360px){.note{font-size:80px}}
@media (prefers-reduced-motion:reduce){.needle,.note{transition:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- Einstellungen ---------- */
const A4 = 440;        /* feste Stimmung */
const NAMES = ["C","Cis","D","Dis","E","F","Fis","G","Gis","A","B","H"];
const GOOD_CT = 5;     /* ± Cent gelten als „gestimmt“ */

const TXT = {
  start: "Mikrofon starten und Ton spielen",
  listen: "Höre zu … spiele einen Ton"
};

/* ---------- Helfer ---------- */
const median = a => { const s = a.slice().sort((p, q) => p - q); return s[Math.floor(s.length / 2)]; };

function noteHTML(m){
  const idx = ((m % 12) + 12) % 12;
  return `${App.esc(NAMES[idx])}<sub>${Math.floor(m / 12) - 1}</sub>`;
}

/* ---------- Tonerkennung (YIN) ---------- */
let ctx = null, stream = null, analyser = null, buf = null, source = null;
let running = false, raf = null, lastRun = 0;
const FFT = 4096;
const W = FFT / 2;

function detectPitch(x, sr){
  /* Lautstärke prüfen */
  let rms = 0;
  for(let i = 0; i < x.length; i++) rms += x[i] * x[i];
  rms = Math.sqrt(rms / x.length);
  if(rms < 0.008) return -1;

  const tauMin = Math.max(2, Math.floor(sr / 1500));
  const tauMax = Math.min(W - 1, Math.floor(sr / 50));
  const d = new Float32Array(tauMax + 1);
  for(let tau = 1; tau <= tauMax; tau++){
    let s = 0;
    for(let j = 0; j < W; j++){ const v = x[j] - x[j + tau]; s += v * v; }
    d[tau] = s;
  }
  const cm = new Float32Array(tauMax + 1);
  cm[0] = 1;
  let run = 0;
  for(let tau = 1; tau <= tauMax; tau++){
    run += d[tau];
    cm[tau] = run ? d[tau] * tau / run : 1;
  }
  let tau = -1;
  for(let t = tauMin; t <= tauMax; t++){
    if(cm[t] < 0.12){
      while(t + 1 <= tauMax && cm[t + 1] < cm[t]) t++;
      tau = t; break;
    }
  }
  if(tau < 0) return -1;

  /* Parabolische Interpolation */
  const a = cm[tau - 1], b = cm[tau], c = tau + 1 <= tauMax ? cm[tau + 1] : cm[tau];
  const den = (a + c - 2 * b);
  const shift = den ? (a - c) / (2 * den) : 0;
  return sr / (tau + shift);
}

/* ---------- Anzeige ---------- */
let noteEl = null, hzEl = null, needleEl = null, statusEl = null;
const recent = [];
let lastSeen = 0;

function showIdle(text){
  if(!noteEl) return;
  noteEl.className = "note idle";
  noteEl.textContent = "–";
  hzEl.textContent = "– Hz";
  needleEl.className = "needle";
  needleEl.style.left = "50%";
  statusEl.className = "status";
  statusEl.textContent = text;
}

function showTone(freq){
  if(!noteEl) return;
  const midi = 69 + 12 * Math.log2(freq / A4);
  const m = Math.round(midi);
  const cents = Math.round((midi - m) * 100);
  const good = Math.abs(cents) <= GOOD_CT;
  const clamped = Math.max(-50, Math.min(50, cents));

  noteEl.className = "note " + (good ? "good" : "off");
  noteEl.innerHTML = noteHTML(m);
  hzEl.textContent = freq.toFixed(1) + " Hz";
  needleEl.className = "needle " + (good ? "good" : "on");
  needleEl.style.left = (50 + clamped) + "%";
  statusEl.className = "status " + (good ? "good" : "off");
  statusEl.textContent = good ? "✓ Gestimmt"
    : (cents < 0 ? `Zu tief · ${Math.abs(cents)} ct – höher stimmen` : `Zu hoch · ${cents} ct – tiefer stimmen`);
}

function loop(ts){
  if(!running) return;
  raf = requestAnimationFrame(loop);
  if(ts - lastRun < 50) return;
  lastRun = ts;
  analyser.getFloatTimeDomainData(buf);
  const f = detectPitch(buf, ctx.sampleRate);
  const now = performance.now();
  if(f > 0){
    lastSeen = now;
    recent.push(f); if(recent.length > 5) recent.shift();
    showTone(median(recent));
  }else if(now - lastSeen > 500){
    recent.length = 0;
    showIdle(TXT.listen);
  }
}

/* ---------- Mikrofon ---------- */
async function startMic(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    App.toast("Dieser Browser unterstützt kein Mikrofon.", "warn");
    return;
  }
  try{
    ctx = new AC();
    if(ctx.state === "suspended") await ctx.resume();
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    source = ctx.createMediaStreamSource(stream);
    analyser = ctx.createAnalyser();
    analyser.fftSize = FFT;
    buf = new Float32Array(FFT);
    source.connect(analyser);
    running = true;
    lastSeen = performance.now();
    App.wake.on();
    render();
    raf = requestAnimationFrame(loop);
  }catch(e){
    stopMic();
    App.toast("Kein Zugriff auf das Mikrofon. Bitte Zugriff erlauben.", "warn");
  }
}

function stopMic(){
  running = false;
  if(raf){ cancelAnimationFrame(raf); raf = null; }
  try{ if(stream) stream.getTracks().forEach(t => t.stop()); }catch(e){}
  try{ if(source) source.disconnect(); }catch(e){}
  try{ if(ctx) ctx.close(); }catch(e){}
  ctx = stream = source = analyser = null;
  recent.length = 0;
  App.wake.off();
  render();
}

/* ---------- Screen ---------- */
function render(){
  App.render(
    App.ui.topbar([{ label: "🎵 Klang-Tools", href: "../klang.html" }]) +
    App.ui.header("STIMMGERÄT", "Spiele einen Ton, das Gerät zeigt dir, wie er klingt") +
    App.ui.card("",
      `<div class="note idle" id="note">–</div>
       <div class="hz" id="hz">– Hz</div>
       <div class="meter" aria-hidden="true">
         <div class="track"></div>
         <div class="zone"></div>
         <div class="tick" style="left:0%"></div>
         <div class="tick" style="left:25%"></div>
         <div class="tick mid" style="left:50%"></div>
         <div class="tick" style="left:75%"></div>
         <div class="tick" style="left:100%"></div>
         <div class="needle" id="needle"></div>
       </div>
       <div class="scale"><span>−50 ct</span><span>0</span><span>+50 ct</span></div>
       <div class="status" id="status"></div>`,
      "display") +
    App.ui.hint("Das Mikrofon wird nur zum Messen genutzt. Es wird nichts aufgenommen und nichts gespeichert.") +
    App.ui.bottom(App.ui.btn(running ? "⏹ Mikrofon stoppen" : "🎤 Mikrofon starten",
      { block: true, action: "mic", cls: running ? "stop" : "" }))
  );
  noteEl = document.getElementById("note");
  hzEl = document.getElementById("hz");
  needleEl = document.getElementById("needle");
  statusEl = document.getElementById("status");
  showIdle(running ? TXT.listen : TXT.start);
}

/* ---------- Aktionen ---------- */
App.on(a => {
  if(a === "mic"){ running ? stopMic() : startMic(); return true; }
});

document.addEventListener("visibilitychange", () => { if(document.hidden && running) stopMic(); });

/* ---------- Start ---------- */
App.screens({ home: render }, { home: "home" });
App.go("home");
</script>
</body>
</html>
